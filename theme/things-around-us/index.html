<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Things Around Us - Spot and Tap</title>
<style>
body {
  margin:0;
  font-family:'Comic Sans MS', sans-serif;
  overflow:hidden;
}

/* Screens */
#logoScreen, #gameScreen, #winScreen {
  display:none;
  width:100vw;
  height:100vh;
  position:absolute;
  top:0;
  left:0;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#logoScreen img {
  width:35vw;
  max-width:250px;
  height:auto;
}

/* Game Screen */
#gameScreen {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  padding:1vw;
  box-sizing:border-box;
  background-image: url('assets/background-room.png');
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  position: relative;
}

/* Instruction */
#instruction {
  position: absolute;
  top: 1vh;
  width: 100%;
  text-align: center;
  font-size: 2vw;
  max-font-size: 15px;
  font-weight: bold;
  color: #003366;
  text-shadow: 1px 1px 2px #fff;
  z-index: 10;
}

/* Voice button */
#voiceBtn {
  position: absolute;
  bottom: 1vh;
  left: 1vw;
  width: 150px;   /* increased size */
  height: 150px;  /* increased size */
  cursor: pointer;
  z-index: 20;
}

/* Object Cards 3 per row */
.object-card {
  position: relative;
  width: 28%;
  max-width:140px;
  text-align: center;
  margin: 0.5%;
  cursor: pointer;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  background: #fff;
  box-sizing: border-box;
}

.object-card img {
  width:100%;
  height:auto;
  transition: transform 0.3s;
}

.object-card.correct img { transform: scale(1.1); }
.object-card.incorrect img { transform: rotate(-10deg); }

.object-card span {
  display: block;
  margin-top:0.3vw;
  font-size: 2vw;
  max-font-size:14px;
  font-weight: bold;
  color: #000;
  word-wrap: break-word;
}

/* Win Screen */
#winScreen {
  display:flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(255,255,255,0.9);
  z-index: 10;
}

#winScreen h1 {
  font-size:7vw;
  max-font-size:40px;
  color:#28a745;
  margin-bottom:2vh;
}

#playAgainBtn {
  padding:2vh 4vw;
  font-size:3.5vw;
  max-font-size:18px;
  border:none;
  border-radius:10px;
  background-color:#4CAF50;
  color:white;
  cursor:pointer;
  z-index:26;
}

#playAgainBtn:hover {background-color:#45a049;}

/* Confetti */
.confetti {
  position:absolute;
  width:3vw;
  height:3vw;
  max-width:20px;
  max-height:20px;
  background-size:contain;
  z-index:20;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translate(0,0) rotate(0deg); opacity:1; }
  100% { transform: translate(var(--x,0vw),100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<!-- Slide 1: Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Slide 2: Game -->
<div id="gameScreen">
  <div id="instruction">Listen to the sound and tap on the object that matches. Try to find all the objects around you!</div>
  <img id="voiceBtn" src="assets/voice-icon.png" alt="Replay Audio">

  <div class="object-card" data-name="chair"><img src="assets/chair.png"><span>Chair</span></div>
  <div class="object-card" data-name="tree"><img src="assets/tree.png"><span>Tree</span></div>
  <div class="object-card" data-name="toys"><img src="assets/toys.png"><span>Toys</span></div>
  <div class="object-card" data-name="refrigerator"><img src="assets/refrigerator.png"><span>Refrigerator</span></div>
  <div class="object-card" data-name="clock"><img src="assets/clock.png"><span>Clock</span></div>
  <div class="object-card" data-name="fan"><img src="assets/fan.png"><span>Fan</span></div>
</div>

<!-- Slide 3: Win -->
<div id="winScreen">
  <h1>Well Done!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<!-- Audio -->
<audio id="chairAudio" src="assets/chair.mp3"></audio>
<audio id="treeAudio" src="assets/tree.mp3"></audio>
<audio id="toysAudio" src="assets/toys.mp3"></audio>
<audio id="refrigeratorAudio" src="assets/refrigerator.mp3"></audio>
<audio id="clockAudio" src="assets/clock.mp3"></audio>
<audio id="fanAudio" src="assets/fan.mp3"></audio>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const winScreen = document.getElementById('winScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const voiceBtn = document.getElementById('voiceBtn');

const objects = Array.from(document.querySelectorAll('.object-card'));
const audioMap = {
  chair: document.getElementById('chairAudio'),
  tree: document.getElementById('treeAudio'),
  toys: document.getElementById('toysAudio'),
  refrigerator: document.getElementById('refrigeratorAudio'),
  clock: document.getElementById('clockAudio'),
  fan: document.getElementById('fanAudio')
};

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

let sequence = ['toys','refrigerator','tree','fan','chair','clock'];
let currentIndex = 0;

// Start Game
function startGame() {
  logoScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  winScreen.style.display = 'none';
  setTimeout(()=>{
    logoScreen.style.display='none';
    gameScreen.style.display='flex';
    randomizeObjects();
    currentIndex = 0;
    playNextAudio();
  }, 5000);
}

// Play next audio
function playNextAudio() {
  if(currentIndex < sequence.length) {
    audioMap[sequence[currentIndex]].currentTime = 0;
    audioMap[sequence[currentIndex]].play();
  }
}

// Voice replay button
voiceBtn.addEventListener('click', ()=>{
  if(currentIndex < sequence.length) {
    audioMap[sequence[currentIndex]].currentTime = 0;
    audioMap[sequence[currentIndex]].play();
  }
});

// Object click handling
objects.forEach(obj => {
  obj.addEventListener('click', () => {
    const name = obj.getAttribute('data-name');
    const expectedName = sequence[currentIndex];
    if (name === expectedName) {
      obj.classList.add('correct');
      correctSound.currentTime = 0;
      correctSound.play();

      // Wait for clap to finish before next audio
      correctSound.onended = () => {
        currentIndex++;
        if (currentIndex < sequence.length) {
          playNextAudio();
        } else {
          setTimeout(showWinScreen, 500);
        }
      };
    } else {
      obj.classList.add('incorrect');
      wrongSound.currentTime = 0;
      wrongSound.play();
      setTimeout(()=>obj.classList.remove('incorrect'),500);
    }
  });
});

// Randomize object positions
function randomizeObjects() {
  const parent = gameScreen;
  const shuffled = objects.sort(()=>0.5-Math.random());
  shuffled.forEach(o=>parent.appendChild(o));
}

// Show Win Screen
function showWinScreen(){
  gameScreen.style.display='none';
  winScreen.style.display='flex';
  createConfetti();
}

// Confetti
function createConfetti(){
  const colors=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff85a1","#00c2ff"];
  for(let i=0;i<100;i++){
    const c=document.createElement('div');
    c.classList.add('confetti');
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = Math.random()*100+'vw';
    c.style.top = Math.random()*80+'vh';
    c.style.animationDuration = (2 + Math.random()*3)+'s';
    winScreen.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
}

// Play Again
playAgainBtn.addEventListener('click',()=>{
  winScreen.style.display='none';
  objects.forEach(o=>o.classList.remove('correct'));
  startGame();
});

startGame();
</script>
</body>
</html>
