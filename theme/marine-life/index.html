<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek-a-Boo Marine Life</title>
<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', sans-serif;
  overflow: hidden;
}

#logoScreen, #gameScreen, #winScreen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 0;
  left: 0;
}

#logoScreen img {
  width: 40vw;
  max-width: 300px;
  height: auto;
}

#instruction {
  position: absolute;
  top: 2vh;
  width: 100%;
  text-align: center;
  font-size: 4vw;
  max-font-size: 24px;
  font-weight: bold;
  color: #003366;
  text-shadow: 1px 1px 2px #fff;
  z-index: 10;
}

#gameScreen {
  background-image: url('assets/background-ocean.png');
  background-size: cover;
  background-position: center;
  overflow: hidden;
}

.coral {
  position: absolute;
  width: 15vw;
  max-width: 200px;
  height: auto;
  z-index: 1;
}

.hiding-spot {
  position: absolute;
  width: 12vw;
  height: 12vw;
  max-width: 150px;
  max-height: 150px;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 5;
  border: 2px dashed rgba(255,255,255,0.7);
}

.hiding-spot span {
  font-size: 2vw;
  max-font-size: 16px;
  color: #fff;
  background-color: rgba(0,0,0,0.5);
  padding: 2px 6px;
  border-radius: 6px;
}

.animal {
  position: absolute;
  width: 18vw;
  max-width: 200px;
  height: auto;
  display: none;
  transition: transform 0.3s;
  z-index: 6;
}

@keyframes bounce {
  0% { transform: translateY(0); }
  30% { transform: translateY(-3vh); }
  50% { transform: translateY(-2vh); }
  70% { transform: translateY(-0.5vh); }
  100% { transform: translateY(0); }
}

.animal.pop {
  display: block;
  animation: bounce 0.5s ease;
}

#winScreen {
  background: rgba(255,255,255,0.8);
  z-index: 20;
  flex-direction: column;
}

#winScreen h1 {
  font-size: 8vw;
  max-font-size: 48px;
  color: #28a745;
  text-align: center;
  margin-bottom: 2vh;
}

#playAgainBtn {
  padding: 2vh 4vw;
  font-size: 4vw;
  max-font-size: 18px;
  border: none;
  border-radius: 10px;
  background-color: #4CAF50;
  color: white;
  cursor: pointer;
  z-index: 26;
}

#playAgainBtn:hover {
  background-color: #45a049;
}

/* Bubbles for game */
.bubble {
  position: absolute;
  width: 6vw;
  height: 6vw;
  max-width: 40px;
  max-height: 40px;
  background: url('assets/bubble.png') no-repeat center/contain;
  opacity: 0.7;
  animation: rise 5s linear infinite;
}

@keyframes rise {
  0% { transform: translateY(100vh) scale(0.5); opacity:0.7; }
  50% { opacity:1; }
  100% { transform: translateY(-5vh) scale(1); opacity:0; }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
border-radius:50%;
animation:fall linear forwards;
z-index:999;
}

@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div id="instruction">Tap the spot to reveal the ocean friend and name the sea animal.</div>

  <!-- Corals -->
  <img src="assets/coral-1.png" class="coral" style="bottom:10%; left:5%;">
  <img src="assets/coral-2.png" class="coral" style="bottom:15%; right:10%;">
  <img src="assets/coral-3.png" class="coral" style="bottom:5%; left:50%;">
  <img src="assets/coral-4.png" class="coral" style="bottom:12%; right:40%;">

  <!-- Hiding spots -->
  <div class="hiding-spot" id="spot1" style="top: 20%; left: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot2" style="top: 20%; right: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot3" style="bottom: 20%; left: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot4" style="bottom: 20%; right: 10%;"><span>Tap Here</span></div>

  <!-- Animals -->
  <img src="assets/fish.png" class="animal" id="fish" style="top:20%; left:10%;">
  <img src="assets/dolphin.png" class="animal" id="dolphin" style="top:20%; right:10%;">
  <img src="assets/crab.png" class="animal" id="crab" style="bottom:20%; left:10%;">
  <img src="assets/octopus.png" class="animal" id="octopus" style="bottom:20%; right:10%;">
</div>

<!-- Win Screen -->
<div id="winScreen">
  <h1>Good Job!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="popSound" src="assets/pop.mp3"></audio>

<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const winScreen = document.getElementById('winScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const popSound = document.getElementById('popSound');

const spotAnimalMap = {
  'spot1': 'fish',
  'spot2': 'dolphin',
  'spot3': 'crab',
  'spot4': 'octopus'
};

// Start game
function startGame() {
  logoScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  winScreen.style.display = 'none';

  setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    resetAnimals();
    generateBubbles(); // bubbles on second slide
  }, 5000);
}

// Reset animals
function resetAnimals() {
  Object.values(spotAnimalMap).forEach(id => {
    document.getElementById(id).classList.remove('pop');
  });
}

// Click handlers
Object.keys(spotAnimalMap).forEach(spotId => {
  const spot = document.getElementById(spotId);
  const animal = document.getElementById(spotAnimalMap[spotId]);

  spot.addEventListener('click', () => {
    animal.classList.remove('pop');
    void animal.offsetWidth;
    animal.classList.add('pop');
    popSound.currentTime = 0;
    popSound.play();
    checkAllAnimals();
  });
});

// Check if all animals revealed
function checkAllAnimals() {
  const allVisible = Object.values(spotAnimalMap).every(id => document.getElementById(id).classList.contains('pop'));
  if (allVisible) {
    setTimeout(() => {
      gameScreen.style.display = 'none';
      winScreen.style.display = 'flex';
      addConfetti();
    }, 10000); // Good Job after 10 sec
  }
}

// Play Again button
playAgainBtn.addEventListener('click', () => {
  removeConfetti();
  winScreen.style.display = 'none';
  startGame();
});

// Bubbles
function generateBubbles() {
  document.querySelectorAll('.bubble').forEach(b => b.remove());
  for(let i=0;i<10;i++){
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.left = Math.random()*90 + 'vw';
    bubble.style.animationDuration = (3 + Math.random()*3) + 's';
    gameScreen.appendChild(bubble);
  }
}

// Confetti multi-direction
function addConfetti() {
  for(let i=0;i<30;i++){
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.left = Math.random()*100 + 'vw';
    confetti.style.top = Math.random()*10 + 'vh';
    confetti.style.animationDuration = (2 + Math.random()*3) + 's';
    confetti.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(confetti);
  }
}

function removeConfetti() {
  document.querySelectorAll('.confetti').forEach(c => c.remove());
}

startGame();
</script>
</body>
</html>
