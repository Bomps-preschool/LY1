<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek-a-Boo Marine Life</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    overflow: hidden;
  }

  #logoScreen, #gameScreen {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  #logoScreen img {
    width: 300px;
    height: auto;
  }

  #instruction {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #003366;
    text-shadow: 1px 1px 2px #fff;
    z-index: 10;
  }

  #gameScreen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url('assets/de3dfaef-4b50-48bc-82d2-39d3a37332e5.png');
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }

  .hiding-spot {
    position: absolute;
    width: 120px;
    height: 120px;
    cursor: pointer;
    border: 2px dashed rgba(255,255,255,0.7);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
  }

  .hiding-spot span {
    font-size: 16px;
    color: #fff;
    background-color: rgba(0,0,0,0.5);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .animal {
    position: absolute;
    width: 120px;
    height: 120px;
    display: none;
    transition: transform 0.3s;
    z-index: 6;
  }

  .animal.pop {
    display: block;
    transform: translateY(-20px);
  }

  #playAgainBtn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
    z-index: 10;
  }

  #playAgainBtn:hover {
    background-color: #45a049;
  }

  .bubble {
    position: absolute;
    width: 40px;
    height: 40px;
    background: url('assets/bubble.png') no-repeat center/contain;
    opacity: 0.7;
    animation: rise 5s linear infinite;
  }

  @keyframes rise {
    0% { transform: translateY(100vh) scale(0.5); opacity:0.7; }
    50% { opacity:1; }
    100% { transform: translateY(-50px) scale(1); opacity:0; }
  }
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div id="instruction">Tap the spot to reveal the ocean friend!</div>

  <!-- Hiding spots -->
  <div class="hiding-spot" id="spot1" style="top: 20%; left: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot2" style="top: 20%; right: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot3" style="bottom: 20%; left: 10%;"><span>Tap Here</span></div>
  <div class="hiding-spot" id="spot4" style="bottom: 20%; right: 10%;"><span>Tap Here</span></div>

  <!-- Animals -->
  <img src="assets/fish.png" class="animal" id="fish" style="top:20%; left:10%;">
  <img src="assets/dolphin.png" class="animal" id="dolphin" style="top:20%; right:10%;">
  <img src="assets/crab.png" class="animal" id="crab" style="bottom:20%; left:10%;">
  <img src="assets/octopus.png" class="animal" id="octopus" style="bottom:20%; right:10%;">
</div>

<button id="playAgainBtn">Play Again</button>

<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const playAgainBtn = document.getElementById('playAgainBtn');

const spotAnimalMap = {
  'spot1': 'fish',
  'spot2': 'dolphin',
  'spot3': 'crab',
  'spot4': 'octopus'
};

function startGame() {
  logoScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  playAgainBtn.style.display = 'none';

  setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    resetAnimals();
    generateBubbles();
  }, 5000);
}

// Reset animals
function resetAnimals() {
  Object.values(spotAnimalMap).forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('pop');
  });
}

// Add click handlers
Object.keys(spotAnimalMap).forEach(spotId => {
  const spot = document.getElementById(spotId);
  const animalId = spotAnimalMap[spotId];
  const animal = document.getElementById(animalId);

  spot.addEventListener('click', () => {
    animal.classList.add('pop');
  });
});

// Play Again button
playAgainBtn.addEventListener('click', () => {
  resetAnimals();
  startGame();
});

// Bubble generation
function generateBubbles() {
  // Remove existing bubbles
  document.querySelectorAll('.bubble').forEach(b => b.remove());

  for(let i=0;i<10;i++){
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.left = Math.random()*90 + 'vw';
    bubble.style.animationDuration = (3 + Math.random()*3) + 's';
    gameScreen.appendChild(bubble);
  }
}

// Start game
startGame();
</script>

</body>
</html>
