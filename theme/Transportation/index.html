<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LY1 Transportation Match</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:Arial,sans-serif;
  background:#fff7e8;color:#294958;
}
button{
  font:inherit;touch-action:manipulation;cursor:pointer;
}
button:focus{outline:3px solid #488bbc}
.screen{
  position:absolute;top:0;left:0;
  width:100%;height:100%;padding:12px;
  display:flex;align-items:center;justify-content:center;
}
.hidden{display:none!important}
.panel{
  width:100%;max-width:900px;height:100%;max-height:760px;
  text-align:center;display:flex;
  flex-direction:column;align-items:center;
}
#splash{background:white;z-index:10}
#splash img{width:55%;max-width:260px}
.welcome{justify-content:center}
h1{font-size:30px;margin:10px 0}
h2{font-size:25px;margin:8px 0}
p{font-size:20px;line-height:1.4;margin:12px 0}
.main{
  background:#28795d;color:white;border:0;
  border-radius:18px;padding:14px 32px;
  font-size:23px;min-height:50px;
}
header{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;min-height:38px;font-size:15px;font-weight:bold;
}
#sound{
  background:white;border:2px solid #b9d5ca;
  border-radius:12px;padding:8px;
}
.vehicle{
  flex:1;min-height:0;width:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.vehicle svg{
  width:100%;max-width:280px;
  height:calc(100% - 32px);max-height:190px;min-height:0;
}
.vehicle strong{font-size:24px;height:32px}
.choices{
  display:flex;flex-wrap:wrap;width:100%;max-width:760px;
  flex:1.25;min-height:0;align-content:stretch;
}
.choice{
  position:relative;width:calc(50% - 12px);margin:6px;
  border:3px solid #dacdac;border-radius:20px;
  background:#fffdf8;color:#294958;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:0;padding:6px;box-shadow:0 3px 0 #e5d9be;
}
.choice svg{
  width:100%;height:calc(100% - 27px);
  max-height:95px;min-height:0;
}
.label{font-size:20px;font-weight:bold;height:27px}
.sign{
  position:absolute;right:7px;top:7px;
  background:white;border:2px solid currentColor;
  border-radius:50%;width:34px;height:34px;
  line-height:30px;font-size:27px;font-weight:bold;
}
.wrong-sign{color:#bd3535}
.right-sign{color:#218347}
.correct{background:#e7f7e9;border-color:#26965a}
.jiggle{animation:jiggle .4s}
.glow{
  border-color:#29975e;
  box-shadow:0 0 0 3px #bae3c3,0 0 22px #76c890;
  animation:glow 1s infinite alternate;
}
.feedback{
  width:100%;height:48px;flex-shrink:0;
  display:flex;justify-content:center;align-items:center;
  font-size:23px;font-weight:bold;color:#28795d;
}
.feedback.bad{color:#bd3535}
#confetti{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:hidden;z-index:20;
}
.piece{
  position:absolute;top:-20px;width:9px;height:13px;
  animation:fall 3s linear forwards;
}
.big-tick{font-size:76px;color:#28795d}

@keyframes jiggle{
  25%{transform:translateX(-6px) rotate(-2deg)}
  50%{transform:translateX(6px) rotate(2deg)}
  75%{transform:translateX(-6px)}
}
@keyframes glow{
  to{box-shadow:0 0 0 4px #bae3c3,0 0 30px #48b576}
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(540deg)}
}

@media(max-height:450px){
  .screen{padding:6px}
  header{min-height:32px}
  h2{font-size:21px;margin:3px 0}
  .vehicle{flex:1}
  .vehicle svg{max-height:85px}
  .vehicle strong{font-size:19px;height:24px}
  .choices{flex:1}
  .choice{
    width:calc(25% - 8px);margin:4px;border-radius:14px;
  }
  .label{font-size:16px;height:22px}
  .feedback{height:32px;font-size:20px}
  h1{font-size:25px}
  p{font-size:17px;margin:8px 0}
  .big-tick{font-size:45px}
}
@media(max-width:360px){
  h2{font-size:22px}
  .label{font-size:18px}
  .feedback{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  .glow{animation:none}
  .piece{animation-duration:1s}
}
</style>
</head>

<body>

<!-- Plain white logo screen for two seconds -->
<div id="splash" class="screen">
  <img src="assets/innovine-logo.png" alt="Innovine">
</div>

<section id="intro" class="screen hidden">
  <div class="panel welcome">
    <h1>Where Do I Go?</h1>
    <p>Look at the vehicle.<br>Tap the place where it travels.</p>
    <p>Road • Railway Tracks • Water • Sky</p>
    <button id="start" class="main">Start</button>
  </div>
</section>

<section id="game" class="screen hidden">
  <div class="panel">
    <header>
      <span id="count"></span>
      <button id="sound" aria-pressed="true">Sound: On</button>
    </header>

    <h2>Where does this vehicle travel?</h2>
    <div id="vehicle" class="vehicle"></div>
    <div id="choices" class="choices"></div>

    <div id="feedback"
         class="feedback"
         role="status"
         aria-live="polite"></div>
  </div>
</section>

<section id="finish" class="screen hidden">
  <div class="panel welcome">
    <div class="big-tick">✓</div>
    <h1>Good job!</h1>
    <p>You matched all the vehicles!</p>
    <button id="again" class="main">Play Again</button>
  </div>
</section>

<div id="confetti" aria-hidden="true"></div>

<audio id="claps"
       src="assets/claps.mp3"
       preload="auto"
       playsinline></audio>

<audio id="wrong"
       src="assets/wrong.mp3"
       preload="auto"
       playsinline></audio>

<script>
(function(){
  'use strict';

  function el(id){
    return document.getElementById(id);
  }

  function svg(d){
    return '<svg viewBox="0 0 220 160" ' +
      'xmlns="http://www.w3.org/2000/svg" ' +
      'aria-hidden="true" focusable="false">' + d + '</svg>';
  }

  // Built-in pictures work without external image downloads.
  var wheels =
    '<circle cx="58" cy="125" r="17" fill="#344b5c"/>' +
    '<circle cx="163" cy="125" r="17" fill="#344b5c"/>';

  var pictures = {
    car:
      '<path d="M37 88l30-40h74l30 40" fill="#e9987a"/>' +
      '<rect x="23" y="82" width="174" height="43" rx="16" fill="#e9987a"/>' +
      '<path d="M74 57h29v27H54zm38 0h24l20 27h-44z" fill="#d1edf3"/>' +
      wheels,

    bus:
      '<rect x="22" y="35" width="175" height="91" rx="13" fill="#edbf62"/>' +
      '<path d="M34 48h30v35H34zm40 0h30v35H74zm40 0h30v35h-30zm40 0h30v63h-30z" fill="#ccebf0"/>' +
      wheels,

    bicycle:
      '<g fill="none" stroke="#344b5c" stroke-width="6">' +
      '<circle cx="49" cy="112" r="32"/>' +
      '<circle cx="169" cy="112" r="32"/></g>' +
      '<path d="M49 112l36-52 32 52H49l20-37h85l15 37m-52 0l37-65h-20m-65 13h29" fill="none" stroke="#c78097" stroke-width="7"/>',

    train:
      '<rect x="18" y="65" width="65" height="57" rx="6" fill="#8eb8cc"/>' +
      '<rect x="91" y="75" width="85" height="48" rx="7" fill="#ba96bd"/>' +
      '<rect x="125" y="34" width="48" height="45" rx="5" fill="#ba96bd"/>' +
      '<rect x="134" y="43" width="27" height="25" fill="#dbf0f4"/>' +
      '<rect x="98" y="45" width="14" height="33" fill="#344b5c"/>' +
      '<path d="M176 90l24 33h-24" fill="#edbf62"/>' +
      '<path d="M29 76h17v25H29zm25 0h17v25H54" fill="#dbf0f4"/>' +
      wheels +
      '<path d="M12 148h196" stroke="#657777" stroke-width="5"/>',

    boat:
      '<path d="M28 105h163l-30 37H59z" fill="#df977a"/>' +
      '<path d="M105 20v85" stroke="#526778" stroke-width="6"/>' +
      '<path d="M97 28l-54 69h54z" fill="#f0cc75"/>' +
      '<path d="M114 35v62h54z" fill="#9ac5b2"/>',

    ship:
      '<path d="M19 99h185l-31 43H55z" fill="#87b3ca"/>' +
      '<rect x="65" y="53" width="92" height="45" fill="#e5b779"/>' +
      '<rect x="96" y="27" width="47" height="26" fill="#b99cbd"/>' +
      '<path d="M77 65h17v18H77zm28 0h17v18h-17zm28 0h14v18h-14" fill="#d9eff4"/>',

    aeroplane:
      '<path d="M20 80l64-7 30-50h22l-13 50 65 3q25 3 0 15l-65 3 16 43h-22L84 97l-61-3z" fill="#89b7ce"/>' +
      '<path d="M39 76L23 45h17l30 30" fill="#e6b77c"/>',

    helicopter:
      '<path d="M102 44V28M49 28h122" stroke="#506777" stroke-width="7"/>' +
      '<ellipse cx="125" cy="80" rx="60" ry="36" fill="#a9c5a0"/>' +
      '<path d="M136 49q33 5 39 29h-39z" fill="#d3edf3"/>' +
      '<path d="M68 72L24 52v39l44-6" fill="#a9c5a0"/>' +
      '<path d="M90 111v18m62-18v18m-75 0h92" stroke="#506777" stroke-width="6"/>'
  };

  var places = {
    road: [
      'Road',
      '<rect width="220" height="160" fill="#d5e5bb"/>' +
      '<path d="M48 0h124l30 160H18z" fill="#75818c"/>' +
      '<path d="M110 4v24m0 20v24m0 20v24m0 20v24" stroke="#fff3cb" stroke-width="6"/>'
    ],

    tracks: [
      'Railway Tracks',
      '<rect width="220" height="160" fill="#e8dfcb"/>' +
      '<path d="M48 15h124M42 45h136M35 78h150M28 112h164M21 145h178" stroke="#a28064" stroke-width="12"/>' +
      '<path d="M65 0L40 160M155 0l25 160" stroke="#566673" stroke-width="8"/>'
    ],

    water: [
      'Water',
      '<rect width="220" height="160" fill="#d7eff5"/>' +
      '<path d="M0 58q22-20 44 0t44 0t44 0t44 0t44 0M0 94q22-20 44 0t44 0t44 0t44 0t44 0M0 130q22-20 44 0t44 0t44 0t44 0t44 0" fill="none" stroke="#70b3cc" stroke-width="8"/>'
    ],

    sky: [
      'Sky',
      '<rect width="220" height="160" fill="#d6edf6"/>' +
      '<circle cx="170" cy="38" r="22" fill="#f0cb76"/>' +
      '<g fill="white">' +
      '<ellipse cx="65" cy="63" rx="45" ry="20"/>' +
      '<circle cx="54" cy="49" r="21"/>' +
      '<circle cx="78" cy="50" r="24"/>' +
      '<ellipse cx="151" cy="117" rx="45" ry="18"/>' +
      '<circle cx="143" cy="103" r="22"/></g>'
    ]
  };

  var bank = [
    ['car', 'Car', 'road'],
    ['bus', 'Bus', 'road'],
    ['bicycle', 'Bicycle', 'road'],
    ['train', 'Train', 'tracks'],
    ['boat', 'Boat', 'water'],
    ['ship', 'Ship', 'water'],
    ['aeroplane', 'Aeroplane', 'sky'],
    ['helicopter', 'Helicopter', 'sky']
  ];

  var order = [];
  var index = 0;
  var attempts = 0;
  var locked = false;
  var sound = true;
  var nextTimer;
  var confettiTimer;

  function shuffle(a){
    a = a.slice();

    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var value = a[i];
      a[i] = a[j];
      a[j] = value;
    }

    return a;
  }

  function screen(id){
    ['splash','intro','game','finish'].forEach(function(x){
      el(x).className =
        x === id ? 'screen' : 'screen hidden';
    });
  }

  function play(id){
    if(!sound) return;

    try{
      var audio = el(id);
      audio.currentTime = 0;
      var promise = audio.play();

      if(promise && promise.catch){
        promise.catch(function(){});
      }
    }catch(e){}
  }

  function stop(){
    ['claps','wrong'].forEach(function(id){
      el(id).pause();
    });
  }

  function render(){
    locked = false;
    attempts = 0;

    el('feedback').className = 'feedback';
    el('feedback').textContent = '';

    var question = order[index];

    el('count').textContent =
      'LY1 • ' + (index + 1) + ' / ' + order.length;

    el('vehicle').innerHTML =
      svg(pictures[question[0]]) +
      '<strong>' + question[1] + '</strong>';

    el('choices').innerHTML = '';

    shuffle(['road','tracks','water','sky']).forEach(function(id){
      var button = document.createElement('button');

      button.className = 'choice';
      button.type = 'button';
      button.setAttribute('aria-label', places[id][0]);
      button.setAttribute('data-place', id);

      button.innerHTML =
        svg(places[id][1]) +
        '<span class="label">' + places[id][0] + '</span>';

      button.onclick = function(){
        answer(button, id);
      };

      el('choices').appendChild(button);
    });
  }

  function mark(button, right){
    var old = button.querySelector('.sign');

    if(old){
      button.removeChild(old);
    }

    var sign = document.createElement('span');

    sign.className =
      'sign ' + (right ? 'right-sign' : 'wrong-sign');

    sign.textContent = right ? '✓' : '✗';
    sign.setAttribute('aria-label', right ? 'Correct' : 'Wrong');

    button.appendChild(sign);
  }

  function answer(button, id){
    if(locked) return;

    if(id === order[index][2]){
      locked = true;
      stop();

      button.className = 'choice correct';
      mark(button, true);

      el('feedback').className = 'feedback';
      el('feedback').textContent = '✓ Good job!';

      var buttons = el('choices').children;

      for(var i = 0; i < buttons.length; i++){
        buttons[i].disabled = true;
      }

      play('claps');

      nextTimer = setTimeout(function(){
        index++;

        if(index === order.length){
          screen('finish');
          confetti();
          play('claps');
        }else{
          render();
        }
      },1900);

    }else{
      attempts++;

      mark(button, false);
      play('wrong');

      button.classList.remove('jiggle');
      void button.offsetWidth;
      button.classList.add('jiggle');

      el('feedback').className = 'feedback bad';

      el('feedback').textContent =
        attempts < 2
          ? '✗ Try again!'
          : '✗ Tap the glowing place!';

      if(attempts >= 2){
        var choices = el('choices').children;

        for(var j = 0; j < choices.length; j++){
          if(
            choices[j].getAttribute('data-place') ===
            order[index][2]
          ){
            choices[j].classList.add('glow');
          }else{
            choices[j].disabled = true;
          }
        }
      }
    }
  }

  function confetti(){
    var box = el('confetti');
    box.innerHTML = '';

    var colours = [
      '#e9987a','#edbf62','#89b7ce','#a9c5a0','#ba96bd'
    ];

    for(var i = 0; i < 50; i++){
      var piece = document.createElement('span');

      piece.className = 'piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colours[i % 5];
      piece.style.animationDelay = Math.random() * .6 + 's';

      box.appendChild(piece);
    }

    confettiTimer = setTimeout(function(){
      box.innerHTML = '';
    },3700);
  }

  function start(){
    clearTimeout(nextTimer);
    clearTimeout(confettiTimer);

    stop();
    el('confetti').innerHTML = '';

    order = shuffle(bank);
    index = 0;

    screen('game');
    render();
  }

  el('start').onclick = start;
  el('again').onclick = start;

  el('sound').onclick = function(){
    sound = !sound;

    this.textContent = 'Sound: ' + (sound ? 'On' : 'Off');
    this.setAttribute('aria-pressed', String(sound));

    if(!sound){
      stop();
    }
  };

  setTimeout(function(){
    screen('intro');
  },2000);

})();
</script>
</body>
</html>
