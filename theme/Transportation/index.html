<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LY1 • Transportation</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: #264458;
  background: #fff6e6;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus {
  outline: 3px solid #347aaa;
  outline-offset: 3px;
}

.screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.hidden {
  display: none !important;
}

#splash {
  background: white;
  z-index: 10;
}

#splash img {
  width: 55%;
  max-width: 260px;
  height: auto;
}

.panel {
  width: 100%;
  max-width: 960px;
  height: 100%;
  max-height: 740px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
}

h1, h2, p {
  margin: 0;
}

h1 {
  font-size: 32px;
  font-size: clamp(24px, 5vw, 42px);
}

h2 {
  font-size: 26px;
  font-size: clamp(23px, 4vw, 36px);
}

p {
  font-size: 19px;
  font-size: clamp(17px, 3vw, 23px);
  line-height: 1.4;
}

.primary {
  border: 0;
  border-radius: 22px;
  background: #28775b;
  color: white;
  padding: 14px 36px;
  font-size: 24px;
  min-height: 52px;
  box-shadow: 0 5px 0 #16523d;
}

.intro-art {
  display: flex;
  width: 100%;
  max-width: 520px;
  height: 140px;
  gap: 10px;
}

.intro-art svg {
  width: 33%;
  height: 100%;
}

.badge {
  font-size: 15px;
  font-weight: bold;
  color: #577074;
}

.game-panel {
  justify-content: flex-start;
  gap: 10px;
}

header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 32px;
}

#sound {
  background: white;
  border: 2px solid #c4d9d4;
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 15px;
}

.progress {
  width: 100%;
  height: 9px;
  flex-shrink: 0;
  border-radius: 9px;
  background: #e1e6db;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  background: #69ac87;
  width: 0;
  transition: width .3s;
}

.prompt {
  flex: 1;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.options {
  width: 100%;
  display: flex;
  gap: 16px;
  flex: 4;
  min-height: 0;
  max-height: 390px;
}

.option {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border: 3px solid #d9cba8;
  border-radius: 26px;
  background: #fffdf6;
  padding: 12px;
  box-shadow: 0 6px 0 #e6dbc3;
  color: #264458;
}

.option svg {
  width: 100%;
  height: 75%;
  min-height: 0;
  max-height: 220px;
}

.option .vehicle-name {
  font-size: 22px;
  font-size: clamp(18px, 3vw, 28px);
  font-weight: bold;
  margin-top: 8px;
}

.answer-sign {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 29px;
  line-height: 1;
  font-weight: bold;
  background: white;
  border: 2px solid currentColor;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.answer-sign.right {
  color: #218347;
}

.answer-sign.wrong {
  color: #bd3535;
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.option.jiggle {
  animation: jiggle .4s;
}

.option.glow {
  border-color: #38a36a;
  box-shadow: 0 0 0 4px #bce8c8, 0 0 24px #70cc91;
  animation: glow 1s infinite alternate;
}

.option.correct {
  background: #e9f8ec;
  border-color: #299657;
}

.feedback {
  flex: 1;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-size: clamp(20px, 4vw, 32px);
  font-weight: bold;
  color: #28775b;
}

.feedback.incorrect {
  color: #bd3535;
}

.finish-icon {
  font-size: 75px;
  color: #28775b;
}

#confetti {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 20;
  overflow: hidden;
}

.piece {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 14px;
  animation: fall 2.8s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(520deg);
  }
}

@keyframes jiggle {
  0%, 100% {
    transform: translateX(0);
  }
  25%, 75% {
    transform: translateX(-7px) rotate(-2deg);
  }
  50% {
    transform: translateX(7px) rotate(2deg);
  }
}

@keyframes glow {
  to {
    box-shadow: 0 0 0 4px #bce8c8, 0 0 34px #49b979;
  }
}

@media (max-width: 500px) {
  .screen {
    padding: 12px;
  }
  .options {
    gap: 8px;
  }
  .option {
    border-radius: 18px;
    padding: 5px;
  }
  .option .vehicle-name {
    font-size: 16px;
  }
  .panel {
    gap: 10px;
  }
}

@media (max-height: 450px) {
  .screen {
    padding: 8px;
  }
  .panel {
    gap: 6px;
  }
  .intro-art {
    height: 80px;
  }
  h1 {
    font-size: 26px;
  }
  p {
    font-size: 17px;
  }
  .prompt {
    flex: 0;
    min-height: 32px;
  }
  h2 {
    font-size: 23px;
  }
  .feedback {
    flex: 0;
    min-height: 30px;
    font-size: 22px;
  }
  .option svg {
    max-height: 130px;
  }
  .primary {
    padding: 9px 28px;
  }
  .finish-icon {
    font-size: 48px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .option.glow {
    animation: none;
  }
  .piece {
    animation-duration: 1s;
  }
}
</style>
</head>

<body>

<!-- First slide: plain white background and logo for 2 seconds -->
<div id="splash" class="screen">
  <img src="assets/innovine-logo.png" alt="Innovine">
</div>

<!-- Instructions -->
<section id="intro" class="screen hidden">
  <div class="panel">
    <div class="badge">LY1 • Transportation</div>
    <h1>Let’s Go!</h1>

    <div id="introArt" class="intro-art" aria-hidden="true"></div>

    <p>Listen to your teacher.<br>Tap the correct vehicle.</p>
    <p>If you need help, look for the glowing picture!</p>

    <button id="start" class="primary">Start</button>
  </div>
</section>

<!-- One question at a time -->
<section id="game" class="screen hidden">
  <div class="panel game-panel">
    <header>
      <span id="counter" class="badge"></span>
      <button id="sound" aria-pressed="true">Sound: On</button>
    </header>

    <div class="progress">
      <span id="bar"></span>
    </div>

    <div class="prompt">
      <h2 id="question"></h2>
    </div>

    <div id="options" class="options"></div>

    <div id="feedback"
         class="feedback"
         role="status"
         aria-live="polite"></div>
  </div>
</section>

<!-- Final slide -->
<section id="finish" class="screen hidden">
  <div class="panel">
    <div class="finish-icon">✓</div>
    <h1>Good job!</h1>
    <p>You explored transportation!</p>
    <button id="again" class="primary">Play Again</button>
  </div>
</section>

<div id="confetti" aria-hidden="true"></div>

<audio id="claps"
       src="assets/claps.mp3"
       preload="auto"
       playsinline></audio>

<audio id="wrong"
       src="assets/wrong.mp3"
       preload="auto"
       playsinline></audio>

<script>
(function () {
  'use strict';

  // Built-in vehicle pictures: no image downloads or external libraries.
  var drawings = {
    car:
      '<path d="M35 94h130l-18-37H71z" fill="#e99579"/>' +
      '<rect x="23" y="88" width="155" height="43" rx="16" fill="#e99579"/>' +
      '<path d="M76 64h29v26H62zm37 0h27l12 26h-39z" fill="#d3edf1"/>' +
      '<circle cx="58" cy="131" r="18" fill="#344b5c"/>' +
      '<circle cx="147" cy="131" r="18" fill="#344b5c"/>' +
      '<circle cx="58" cy="131" r="8" fill="#eee"/>' +
      '<circle cx="147" cy="131" r="8" fill="#eee"/>',

    bus:
      '<rect x="20" y="45" width="164" height="91" rx="15" fill="#edbf62"/>' +
      '<path d="M30 57h29v35H30zm37 0h29v35H67zm37 0h29v35h-29zm37 0h30v60h-30z" fill="#c8e7ec"/>' +
      '<circle cx="55" cy="136" r="17" fill="#344b5c"/>' +
      '<circle cx="152" cy="136" r="17" fill="#344b5c"/>',

    train:
      '<rect x="18" y="74" width="62" height="54" rx="7" fill="#87b6cc"/>' +
      '<rect x="88" y="85" width="88" height="43" rx="6" fill="#b990bb"/>' +
      '<rect x="116" y="48" width="51" height="46" rx="5" fill="#b990bb"/>' +
      '<rect x="123" y="55" width="29" height="27" fill="#d6f1f3"/>' +
      '<rect x="95" y="58" width="13" height="31" fill="#46596a"/>' +
      '<path d="M172 99l22 29h-22" fill="#edbf62"/>' +
      '<path d="M28 85h16v22H28zm23 0h17v22H51" fill="#d6f1f3"/>' +
      '<g fill="#344b5c">' +
      '<circle cx="35" cy="133" r="13"/>' +
      '<circle cx="65" cy="133" r="13"/>' +
      '<circle cx="109" cy="133" r="13"/>' +
      '<circle cx="156" cy="133" r="20"/>' +
      '</g>' +
      '<path d="M15 156h180" stroke="#6d7b7e" stroke-width="5"/>',

    boat:
      '<path d="M28 112h149l-28 38H58z" fill="#df9376"/>' +
      '<path d="M102 29v84" stroke="#556779" stroke-width="6"/>' +
      '<path d="M94 38L40 103h54z" fill="#f0ca70"/>' +
      '<path d="M111 45v57h52z" fill="#9ac6b2"/>' +
      '<path d="M17 159q15-12 30 0t30 0t30 0t30 0t30 0t30 0" fill="none" stroke="#83bacd" stroke-width="6"/>',

    aeroplane:
      '<path d="M22 95l59-7 29-52h21l-13 53 58 3q26 3 0 16l-60 3 17 43h-21l-32-40-56-3z" fill="#86b5cd"/>' +
      '<path d="M40 92L25 61h17l28 29" fill="#e4ad72"/>' +
      '<path d="M149 94h14l11 8h-25z" fill="#e3f2f6"/>',

    bicycle:
      '<g fill="none" stroke="#344b5c" stroke-width="6">' +
      '<circle cx="49" cy="125" r="32"/>' +
      '<circle cx="158" cy="125" r="32"/>' +
      '</g>' +
      '<path d="M49 125l36-52 30 52H49l20-37h75l14 37m-43 0l29-59h-17m-57 7h29" fill="none" stroke="#c77e93" stroke-width="7" stroke-linejoin="round"/>'
  };

  var names = {
    car: 'Car',
    bus: 'Bus',
    train: 'Train',
    boat: 'Boat',
    aeroplane: 'Aeroplane',
    bicycle: 'Bicycle'
  };

  var bank = [
    ['car', 'Find the car.'],
    ['bus', 'Find the bus.'],
    ['train', 'Find the train.'],
    ['boat', 'Find the boat.'],
    ['aeroplane', 'Find the aeroplane.'],
    ['bicycle', 'Find the bicycle.'],
    ['boat', 'Which vehicle sails on water?'],
    ['aeroplane', 'Which vehicle flies in the sky?'],
    ['train', 'Which vehicle runs on railway tracks?'],
    ['bus', 'Which vehicle carries many people on the road?'],
    ['bicycle', 'Which vehicle has pedals?'],
    ['car', 'Which vehicle is a car?']
  ];

  var ids = [
    'car', 'bus', 'train',
    'boat', 'aeroplane', 'bicycle'
  ];

  var order = [];
  var position = 0;
  var attempts = 0;
  var locked = false;
  var sound = true;
  var nextTimer = null;
  var celebrateTimer = null;
  var splashTimer = null;

  function el(id) {
    return document.getElementById(id);
  }

  function art(id) {
    return '<svg viewBox="0 0 210 180" ' +
      'xmlns="http://www.w3.org/2000/svg" ' +
      'aria-hidden="true" focusable="false">' +
      drawings[id] + '</svg>';
  }

  function shuffle(a) {
    a = a.slice();

    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var value = a[i];
      a[i] = a[j];
      a[j] = value;
    }

    return a;
  }

  function screen(id) {
    ['splash', 'intro', 'game', 'finish'].forEach(function (x) {
      el(x).className = x === id ? 'screen' : 'screen hidden';
    });
  }

  function play(id) {
    if (!sound) return;

    var audio = el(id);

    try {
      audio.currentTime = 0;
      var promise = audio.play();

      if (promise && promise.catch) {
        promise.catch(function () {});
      }
    } catch (e) {}
  }

  function stopAudio() {
    ['claps', 'wrong'].forEach(function (id) {
      el(id).pause();

      try {
        el(id).currentTime = 0;
      } catch (e) {}
    });
  }

  // Prepare audio from the learner's Start or Play Again tap.
  function unlock() {
    if (!sound) return;

    ['claps', 'wrong'].forEach(function (id) {
      var audio = el(id);
      audio.muted = true;

      try {
        var promise = audio.play();

        if (promise && promise.then) {
          promise.then(
            function () {
              audio.pause();
              audio.currentTime = 0;
              audio.muted = false;
            },
            function () {
              audio.muted = false;
            }
          );
        } else {
          audio.pause();
          audio.muted = false;
        }
      } catch (e) {
        audio.muted = false;
      }
    });
  }

  function render() {
    attempts = 0;
    locked = false;

    el('feedback').textContent = '';
    el('feedback').className = 'feedback';

    var question = order[position];

    el('question').textContent = question[1];

    el('counter').textContent =
      'Transportation • ' + (position + 1) + ' / ' + order.length;

    el('bar').style.width =
      (position / order.length * 100) + '%';

    var others = shuffle(ids.filter(function (id) {
      return id !== question[0];
    }));

    var choices = shuffle([
      question[0], others[0], others[1]
    ]);

    el('options').innerHTML = '';

    choices.forEach(function (id) {
      var button = document.createElement('button');

      button.type = 'button';
      button.className = 'option';
      button.setAttribute('aria-label', names[id]);
      button.setAttribute('data-id', id);

      button.innerHTML =
        art(id) +
        '<span class="vehicle-name">' + names[id] + '</span>';

      button.onclick = function () {
        answer(button, id);
      };

      el('options').appendChild(button);
    });
  }

  function mark(button, correct) {
    var oldSign = button.querySelector('.answer-sign');

    if (oldSign) {
      button.removeChild(oldSign);
    }

    var sign = document.createElement('span');

    sign.className =
      'answer-sign ' + (correct ? 'right' : 'wrong');

    sign.textContent = correct ? '✓' : '✗';

    sign.setAttribute(
      'aria-label',
      correct ? 'Correct answer' : 'Wrong answer'
    );

    button.appendChild(sign);
  }

  function answer(button, id) {
    if (locked) return;

    var correct = order[position][0];

    if (id === correct) {
      locked = true;
      stopAudio();

      button.className = 'option correct';
      mark(button, true);

      el('feedback').className = 'feedback';
      el('feedback').textContent = '✓ Good job!';

      var buttons = el('options').children;

      for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
      }

      play('claps');

      nextTimer = setTimeout(function () {
        position++;

        if (position === order.length) {
          screen('finish');
          confetti();
          play('claps');
        } else {
          render();
        }
      }, 1900);

    } else {
      attempts++;

      mark(button, false);
      play('wrong');

      button.classList.remove('jiggle');
      void button.offsetWidth;
      button.classList.add('jiggle');

      el('feedback').className = 'feedback incorrect';

      if (attempts >= 2) {
        el('feedback').textContent =
          '✗ Tap the glowing picture!';

        var options = el('options').children;

        for (var n = 0; n < options.length; n++) {
          if (options[n].getAttribute('data-id') === correct) {
            options[n].classList.add('glow');
          } else {
            options[n].disabled = true;
          }
        }
      } else {
        el('feedback').textContent = '✗ Try again!';
      }
    }
  }

  function confetti() {
    clearTimeout(celebrateTimer);

    var box = el('confetti');
    box.innerHTML = '';

    var colours = [
      '#e99579', '#edbf62', '#87b6cc',
      '#9ac6b2', '#b990bb'
    ];

    for (var i = 0; i < 55; i++) {
      var piece = document.createElement('span');

      piece.className = 'piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colours[i % colours.length];
      piece.style.animationDelay = Math.random() * .7 + 's';

      box.appendChild(piece);
    }

    celebrateTimer = setTimeout(function () {
      box.innerHTML = '';
    }, 3700);
  }

  function start() {
    clearTimeout(nextTimer);
    clearTimeout(celebrateTimer);
    clearTimeout(splashTimer);

    el('confetti').innerHTML = '';

    stopAudio();
    unlock();

    order = shuffle(bank);
    position = 0;

    screen('game');
    render();
  }

  el('introArt').innerHTML =
    art('car') + art('boat') + art('aeroplane');

  el('start').onclick = start;
  el('again').onclick = start;

  el('sound').onclick = function () {
    sound = !sound;

    this.textContent = 'Sound: ' + (sound ? 'On' : 'Off');
    this.setAttribute('aria-pressed', String(sound));

    if (sound) {
      unlock();
    } else {
      stopAudio();
    }
  };

  splashTimer = setTimeout(function () {
    screen('intro');
  }, 2000);

})();
</script>

</body>
</html>
