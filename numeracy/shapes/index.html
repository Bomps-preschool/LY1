<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop Game</title>
<style>
body {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #e0f0f5;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#logoScreen, #gameScreen, #endScreen {
    display: none;
    width: 100%;
    text-align: center;
}
#logoScreen img {
    width: 200px;
    margin-top: 50px;
}
#gameScreen {
    padding-top: 20px;
}
.outline-container {
    display: flex;
    justify-content: center;
    margin: 20px;
    gap: 40px;
}
.outline {
    width: 150px;
    height: 150px;
    border: 4px dashed #555;
    border-radius: 15px;
}
.draggable-container {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    gap: 20px;
    flex-wrap: wrap;
}
.draggable {
    width: 100px;
    height: 100px;
    cursor: grab;
    border-radius: 10px;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#playAgain {
    background-color: #4CAF50;
    color: white;
}
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
    <h2>Count the shapes and drag to the correct outline</h2>
    <p>Tap on the shapes</p>
    <div class="outline-container">
        <div class="outline" data-shape="triangle" id="triangleOutline"></div>
        <div class="outline" data-shape="square" id="squareOutline"></div>
        <div class="outline" data-shape="circle" id="circleOutline"></div>
    </div>
    <div class="draggable-container" id="shapesContainer">
        <img src="assets/triangle.png" class="draggable" draggable="true" data-shape="triangle">
        <img src="assets/triangle.png" class="draggable" draggable="true" data-shape="triangle">
        <img src="assets/square.png" class="draggable" draggable="true" data-shape="square">
        <img src="assets/square.png" class="draggable" draggable="true" data-shape="square">
        <img src="assets/circle.png" class="draggable" draggable="true" data-shape="circle">
        <img src="assets/circle.png" class="draggable" draggable="true" data-shape="circle">
    </div>
</div>

<!-- End Screen -->
<div id="endScreen">
    <h1>Well Done!</h1>
    <button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const shapes = document.querySelectorAll('.draggable');
const outlines = document.querySelectorAll('.outline');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const playAgainBtn = document.getElementById('playAgain');

// Show logo for 5 seconds
logoScreen.style.display = 'block';
setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'block';
}, 5000);

let draggedShape = null;
shapes.forEach(shape => {
    shape.addEventListener('dragstart', e => {
        draggedShape = e.target;
    });
});

outlines.forEach(outline => {
    outline.addEventListener('dragover', e => {
        e.preventDefault();
    });

    outline.addEventListener('drop', e => {
        e.preventDefault();
        if(draggedShape.dataset.shape === outline.dataset.shape) {
            correctSound.play();
            draggedShape.style.display = 'none'; // disappear when correctly dropped
            checkEndGame();
        } else {
            wrongSound.play();
        }
    });
});

function checkEndGame() {
    const remaining = Array.from(shapes).some(s => s.style.display !== 'none');
    if(!remaining) {
        gameScreen.style.display = 'none';
        endScreen.style.display = 'block';
    }
}

playAgainBtn.addEventListener('click', () => {
    shapes.forEach(s => s.style.display = 'inline-block');
    endScreen.style.display = 'none';
    gameScreen.style.display = 'block';
});
</script>
</body>
</html>
