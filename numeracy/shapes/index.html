<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Matching Game</title>
<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background-color: #e0f0f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin:0;
    height:100vh;
    overflow: hidden;
  }

  #logo-screen, #game-screen, #congrats-screen {
    position: absolute;
    top:0;
    left:0;
    width: 100%;
    height:100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #game-screen, #congrats-screen { display:none; }

  h2 {
    margin-bottom: 10px;
    text-align: center;
  }

  .drop-target {
    width: 150px;
    height: 150px;
    border: 4px dashed #555;
    border-radius: 12px;
    display: inline-block;
    margin: 20px;
    vertical-align: top;
  }

  .draggable {
    width: 120px;
    height: 120px;
    margin: 10px;
    cursor: grab;
  }

  #draggable-container {
    margin-top: 40px;
  }

  #congrats-screen button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
  }

  /* Confetti styling */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: #fcd000;
    opacity: 0.9;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Innovine Logo Splash -->
<div id="logo-screen">
  <img src="assets/innovine-logo.png" style="width:250px;">
</div>

<!-- Game Slide -->
<div id="game-slide" class="slide">
  <div id="instruction">Count the shapes and drag to the correct outline<br>Tap on the shapes</div>
  
  <div class="outline-container">
    <div class="outline" data-shape="triangle-outline"><img src="assets/triangle-outline.png" alt="Triangle Outline"></div>
    <div class="outline" data-shape="square-outline"><img src="assets/square-outline.png" alt="Square Outline"></div>
    <div class="outline" data-shape="circle-outline"><img src="assets/circle-outline.png" alt="Circle Outline"></div>
  </div>

  <div class="draggables" id="shapes-container">
    <img src="assets/triangle.png" alt="Triangle" class="draggable" data-shape="triangle-outline">
    <img src="assets/triangle.png" alt="Triangle" class="draggable" data-shape="triangle-outline">
    <img src="assets/square.png" alt="Square" class="draggable" data-shape="square-outline">
    <img src="assets/square.png" alt="Square" class="draggable" data-shape="square-outline">
    <img src="assets/circle.png" alt="Circle" class="draggable" data-shape="circle-outline">
    <img src="assets/circle.png" alt="Circle" class="draggable" data-shape="circle-outline">
  </div>
</div>


<!-- Congratulations Screen -->
<div id="congrats-screen">
  <h1>Well Done!</h1>
  <img src="assets/innovine-logo.png" style="width:200px;">
  <button id="play-again">Play Again</button>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
const logoScreen = document.getElementById('logo-screen');
const gameScreen = document.getElementById('game-screen');
const congratsScreen = document.getElementById('congrats-screen');
const draggables = document.querySelectorAll('.draggable');
const dropTargets = document.querySelectorAll('.drop-target');
const correctSound = document.getElementById('correct-sound');
const wrongSound = document.getElementById('wrong-sound');
const playAgainBtn = document.getElementById('play-again');

let placedCount = 0;

// Show game after 5 seconds
setTimeout(() => {
  logoScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
}, 5000);

// Drag and Drop
draggables.forEach(draggable => {
  draggable.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', e.target.dataset.shape);
    e.dataTransfer.effectAllowed = 'move';
  });
});

dropTargets.forEach(target => {
  target.addEventListener('dragover', e => e.preventDefault());
  target.addEventListener('drop', e => {
    e.preventDefault();
    const shape = e.dataTransfer.getData('text/plain');
    if(shape === target.dataset.shape){
      const img = document.querySelector(`.draggable[data-shape="${shape}"]`);
      if(img){
        target.appendChild(img);
        correctSound.play();
        placedCount++;
        if(placedCount === draggables.length){
          setTimeout(showCongrats, 500);
        }
      }
    } else {
      wrongSound.play();
    }
  });
});

// Show Congrats and confetti
function showCongrats(){
  gameScreen.style.display = 'none';
  congratsScreen.style.display = 'flex';
  createConfetti();
}

// Play Again
playAgainBtn.addEventListener('click', () => {
  congratsScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  placedCount = 0;

  // Reset draggable positions
  draggables.forEach(d => document.getElementById('draggable-container').appendChild(d));

  // Shuffle draggable positions
  const container = document.getElementById('draggable-container');
  for(let i = container.children.length; i>=0; i--){
    container.appendChild(container.children[Math.random() * i | 0]);
  }
});

// Confetti animation
function createConfetti(){
  for(let i=0;i<100;i++){
    let confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.backgroundColor = `hsl(${Math.random()*360},70%,60%)`;
    confetti.style.left = `${Math.random()*100}%`;
    confetti.style.top = `-10px`;
    document.body.appendChild(confetti);
    animateConfetti(confetti);
  }
}

function animateConfetti(el){
  let top = 0;
  const interval = setInterval(()=>{
    top += Math.random()*5 + 2;
    el.style.top = top + 'px';
    if(top > window.innerHeight){
      el.remove();
      clearInterval(interval);
    }
  },20);
}
</script>
</body>
</html>
