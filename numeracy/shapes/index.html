<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background-color: #d9ecf2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  #logoScreen, #gameScreen, #winScreen {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  #logoScreen img {
    width: 300px;
    height: auto;
  }

  #gameScreen {
    background-color: #f9f3e9;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
  }

  .outline-container {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-bottom: 30px;
  }

  .outline-box {
    width: 120px;
    height: 120px;
    border: 4px dashed #555;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    position: relative;
  }

  .outline-box img {
    width: 80%;
    height: 80%;
    pointer-events: none; /* allow drop */
  }

  .shapes-row {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .draggable-shape {
    width: 100px;
    height: 100px;
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    border-radius: 10px;
  }

  .draggable-shape img {
    width: 90%;
    height: 90%;
    user-select: none;
    pointer-events: none;
  }

  #winScreen {
    text-align: center;
  }

  #winScreen button {
    padding: 10px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
  }

  #winScreen button:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<!-- Innovine Logo Screen -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <h2>Count the shapes and drag to the correct outline</h2>
  <p>Tap on the shapes</p>
  <div class="outline-container">
    <div class="outline-box" data-shape="triangle">
      <img src="assets/triangle-outline.png" alt="Triangle Outline">
    </div>
    <div class="outline-box" data-shape="square">
      <img src="assets/square-outline.png" alt="Square Outline">
    </div>
    <div class="outline-box" data-shape="circle">
      <img src="assets/circle-outline.png" alt="Circle Outline">
    </div>
  </div>
  <div class="shapes-row">
    <div class="draggable-shape" draggable="true" data-shape="triangle">
      <img src="assets/square.png" alt="Triangle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="triangle">
      <img src="assets/triangle.png" alt="Triangle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="square">
      <img src="assets/circle.png" alt="Square">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="square">
      <img src="assets/triangle.png" alt="Square">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="circle">
      <img src="assets/circle.png" alt="Circle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="circle">
      <img src="assets/square.png" alt="Circle">
    </div>
  </div>
</div>

<!-- Win Screen -->
<div id="winScreen">
  <h1>Well Done!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/claps.mp3"></audio>

<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const winScreen = document.getElementById('winScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const confetti = document.getElementById('confetti');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

let draggedShape = null;
let totalShapes = document.querySelectorAll('.draggable-shape').length;
let correctDrops = 0;

function startGame() {
  logoScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  winScreen.style.display = 'none';
  setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
  }, 5000);
}

// Drag & Drop
document.querySelectorAll('.draggable-shape').forEach(shape => {
  shape.addEventListener('dragstart', e => {
    draggedShape = shape;
  });
});

document.querySelectorAll('.outline-box').forEach(box => {
  box.addEventListener('dragover', e => e.preventDefault());
  box.addEventListener('drop', e => {
    const shapeType = draggedShape.dataset.shape;
    const boxType = box.dataset.shape;
    if (shapeType === boxType) {
      draggedShape.style.display = 'none'; // disappear when correctly placed
      correctSound.play();
      correctDrops++;
      if (correctDrops === totalShapes) {
        setTimeout(() => showWinScreen(), 500);
      }
    } else {
      wrongSound.play();
    }
    draggedShape = null;
  });
});

function showWinScreen() {
  gameScreen.style.display = 'none';
  winScreen.style.display = 'flex';
  confetti.style.display = 'block';
}

playAgainBtn.addEventListener('click', () => {
  // Reset game
  document.querySelectorAll('.draggable-shape').forEach(s => s.style.display = 'flex');
  correctDrops = 0;
  confetti.style.display = 'none';
  startGame();
});

// Initialize
startGame();
</script>

</body>
</html>
