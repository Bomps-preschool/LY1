<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag & Drop</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background-color: #E6F2F8;
    margin: 0;
    overflow-x: hidden;
  }
  .center-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #logo-screen, #game-screen, #congrats-screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #logo-screen img {
    width: 300px;
    height: auto;
  }
  #game-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #instruction {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 20px;
  }
  #outline-container {
    display: flex;
    justify-content: space-around;
    width: 80%;
    margin-bottom: 50px;
  }
  .outline {
    border: 4px dashed #666;
    border-radius: 15px;
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #shapes-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    width: 90%;
  }
  .draggable {
    width: 100px;
    height: 100px;
    cursor: grab;
    user-select: none;
    border-radius: 15px;
    padding: 5px;
    background-color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #congrats-screen img {
    width: 350px;
    margin-bottom: 20px;
  }
  #congrats-screen h1 {
    font-size: 2rem;
    color: #333;
  }
  #play-again-btn {
    font-size: 1.2rem;
    padding: 10px 20px;
    border: none;
    background-color: #6AA84F;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
  }
  canvas.confetti {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Innovine Logo Screen -->
<div id="logo-screen" class="center-screen">
  <img src="innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div id="instruction">
    Count the shapes and drag to the correct outline<br>
    <small>Tap on the shapes</small>
  </div>
  <div id="outline-container">
    <div class="outline" data-shape="triangle"><img src="triangle-outline.png" style="width: 80%; height: 80%;"></div>
    <div class="outline" data-shape="square"><img src="square-outline.png" style="width: 80%; height: 80%;"></div>
    <div class="outline" data-shape="circle"><img src="circle-outline.png" style="width: 80%; height: 80%;"></div>
  </div>
  <div id="shapes-container">
    <div class="draggable" draggable="true" data-shape="triangle"><img src="triangle.png" style="width: 80%; height: 80%;"></div>
    <div class="draggable" draggable="true" data-shape="triangle"><img src="triangle.png" style="width: 80%; height: 80%;"></div>
    <div class="draggable" draggable="true" data-shape="square"><img src="square.png" style="width: 80%; height: 80%;"></div>
    <div class="draggable" draggable="true" data-shape="square"><img src="square.png" style="width: 80%; height: 80%;"></div>
    <div class="draggable" draggable="true" data-shape="circle"><img src="circle.png" style="width: 80%; height: 80%;"></div>
    <div class="draggable" draggable="true" data-shape="circle"><img src="circle.png" style="width: 80%; height: 80%;"></div>
  </div>
</div>

<!-- Congratulations Screen -->
<div id="congrats-screen" class="center-screen">
  <img src="star.png" alt="Confetti">
  <h1>Well Done!</h1>
  <button id="play-again-btn">Play Again</button>
</div>

<!-- Audio -->
<audio id="correct-sound" src="correct.mp3"></audio>
<audio id="wrong-sound" src="wrong.mp3"></audio>

<script>
const logoScreen = document.getElementById('logo-screen');
const gameScreen = document.getElementById('game-screen');
const congratsScreen = document.getElementById('congrats-screen');
const draggables = document.querySelectorAll('.draggable');
const outlines = document.querySelectorAll('.outline');
const correctSound = document.getElementById('correct-sound');
const wrongSound = document.getElementById('wrong-sound');
const playAgainBtn = document.getElementById('play-again-btn');

// Show Innovine logo for 5 seconds
logoScreen.style.display = 'flex';
setTimeout(() => {
  logoScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
}, 5000);

// Drag and Drop logic
draggables.forEach(draggable => {
  draggable.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', draggable.dataset.shape);
    draggable.style.opacity = '0.5';
  });
  draggable.addEventListener('dragend', e => {
    draggable.style.opacity = '1';
  });
});

outlines.forEach(outline => {
  outline.addEventListener('dragover', e => e.preventDefault());
  outline.addEventListener('drop', e => {
    e.preventDefault();
    const shape = e.dataTransfer.getData('text/plain');
    if(shape === outline.dataset.shape){
      outline.appendChild(document.querySelector(`.draggable[data-shape="${shape}"]`));
      correctSound.play();
      checkCompletion();
    } else {
      wrongSound.play();
    }
  });
});

function checkCompletion(){
  let completed = true;
  outlines.forEach(outline => {
    if(outline.children.length === 0) completed = false;
  });
  if(completed){
    gameScreen.style.display = 'none';
    congratsScreen.style.display = 'flex';
    startConfetti();
  }
}

// Play again button
playAgainBtn.addEventListener('click', () => {
  window.location.reload();
});

// Confetti
function startConfetti(){
  const canvas = document.createElement('canvas');
  canvas.classList.add('confetti');
  document.body.appendChild(canvas);
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const confetti = [];
  for(let i=0; i<100; i++){
    confetti.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height - canvas.height,
      r: Math.random()*6+4,
      d: Math.random()*10+5,
      color: `hsl(${Math.random()*360},70%,50%)`,
      tilt: Math.random()*10-10
    });
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c => {
      ctx.beginPath();
      ctx.lineWidth = c.r;
      ctx.strokeStyle = c.color;
      ctx.moveTo(c.x+c.tilt, c.y);
      ctx.lineTo(c.x+c.tilt, c.y+c.r*2);
      ctx.stroke();
      c.y += Math.sqrt(c.d)+1;
      c.tilt += 0.1;
      if(c.y>canvas.height) c.y = -10;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
</html>
