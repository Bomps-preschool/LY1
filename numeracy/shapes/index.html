<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovine Shapes Game</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: #FFF8DC; /* soft background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .slide {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .active {
    display: flex;
  }

  #logo img {
    width: 200px;
    height: auto;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
  }

  .outlines {
    display: flex;
    gap: 50px;
  }

  .outlines img {
    width: 120px;
    height: 120px;
    border: 2px dashed #888;
  }

  .draggables {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .draggables img {
    width: 100px;
    height: 100px;
    cursor: grab;
  }

  .text-label {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
    color: #333;
  }

  .well-done {
    font-size: 48px;
    color: #4CAF50;
    margin-bottom: 30px;
  }

  button {
    padding: 15px 30px;
    font-size: 24px;
    background: #FFB347; 
    border: none;
    border-radius: 15px;
    cursor: pointer;
  }

  button:hover {
    background: #FFCC70;
  }
</style>
</head>
<body>

<!-- Slide 1: Innovine Logo -->
<div class="slide active" id="logo">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Slide 2: Drag and Drop Shapes -->
<div class="slide" id="game">
  <div class="game-container">
    <div class="outlines" id="outlines">
      <div>
        <img src="assets/triangle-outline.png" data-shape="triangle" class="dropzone">
        <div class="text-label">Triangle</div>
      </div>
      <div>
        <img src="assets/square-outline.png" data-shape="square" class="dropzone">
        <div class="text-label">Square</div>
      </div>
      <div>
        <img src="assets/circle-outline.png" data-shape="circle" class="dropzone">
        <div class="text-label">Circle</div>
      </div>
    </div>

    <div class="draggables" id="draggables">
      <img src="assets/triangle.png" data-shape="triangle" draggable="true" class="draggable">
      <img src="assets/triangle.png" data-shape="triangle" draggable="true" class="draggable">
      <img src="assets/square.png" data-shape="square" draggable="true" class="draggable">
      <img src="assets/square.png" data-shape="square" draggable="true" class="draggable">
      <img src="assets/circle.png" data-shape="circle" draggable="true" class="draggable">
      <img src="assets/circle.png" data-shape="circle" draggable="true" class="draggable">
    </div>
  </div>
</div>

<!-- Slide 3: Well Done -->
<div class="slide" id="well-done">
  <div class="well-done">Well Done!</div>
  <button id="play-again">Play Again</button>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
  const slides = document.querySelectorAll('.slide');
  let currentSlide = 0;

  const showSlide = (index) => {
    slides.forEach(slide => slide.classList.remove('active'));
    slides[index].classList.add('active');
  }

  // Show logo for 5 seconds then start game
  setTimeout(() => {
    currentSlide = 1;
    showSlide(currentSlide);
  }, 5000);

  // Drag and drop logic
  const draggables = document.querySelectorAll('.draggable');
  const dropzones = document.querySelectorAll('.dropzone');
  const correctSound = document.getElementById('correct-sound');
  const wrongSound = document.getElementById('wrong-sound');

  draggables.forEach(drag => {
    drag.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', e.target.dataset.shape);
      e.target.style.opacity = 0.5;
    });

    drag.addEventListener('dragend', e => {
      e.target.style.opacity = 1;
    });
  });

  dropzones.forEach(drop => {
    drop.addEventListener('dragover', e => {
      e.preventDefault();
    });

    drop.addEventListener('drop', e => {
      e.preventDefault();
      const draggedShape = e.dataTransfer.getData('text');
      const dropShape = drop.dataset.shape;

      if(draggedShape === dropShape) {
        correctSound.play();
        // remove one draggable of the same type
        const dragged = [...draggables].find(d => d.dataset.shape === draggedShape && !d.classList.contains('placed'));
        if(dragged){
          dragged.classList.add('placed');
          dragged.style.display = 'none';
        }

        // Check if all placed
        const allPlaced = [...draggables].every(d => d.classList.contains('placed'));
        if(allPlaced){
          currentSlide = 2;
          showSlide(currentSlide);
        }
      } else {
        wrongSound.play();
      }
    });
  });

  // Play Again button
  document.getElementById('play-again').addEventListener('click', () => {
    // Reset draggables
    draggables.forEach(d => {
      d.style.display = 'inline-block';
      d.classList.remove('placed');
    });
    currentSlide = 0;
    showSlide(currentSlide);

    // show logo again for 5 sec
    setTimeout(() => {
      currentSlide = 1;
      showSlide(currentSlide);
    }, 5000);
  });
</script>

</body>
</html>
