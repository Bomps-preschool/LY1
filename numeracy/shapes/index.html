<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Puzzle Fit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:"Comic Sans MS","Arial Rounded MT Bold",sans-serif; overflow:hidden;}
.screen{width:100vw;height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;}
.active{display:flex;}
#logoScreen{background:white;align-items:center;justify-content:center;}
#logoScreen img{width:min(300px,70vw);}
#gameScreen{flex-direction:column;width:100%;align-items:center;position:relative;background: url('assets/d97129a7-954d-42b4-8a30-2ea13b2a469f.png') no-repeat center/cover;}
.header{text-align:center;margin-bottom:12px;}
.header h1{font-size:clamp(24px,5vw,40px);color:#6b2fa8;}
.header p{font-size:16px;color:#555;}
.gameArea{position:relative;width:100%;flex:1;}
.topShapes{position:absolute;top:20%;width:100%;display:flex;justify-content:center;gap:40px;}
.topShapes img{width:80px;height:80px;cursor:pointer;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.15);transition:transform 0.2s;}
.topShapes img:active{transform:scale(1.1);}
.outlines{position:absolute;bottom:80px;width:100%;display:flex;justify-content:center;gap:120px;}
.outline{width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
.outline img{width:100%;height:100%;}
</style>
</head>
<body>
<div id="logoScreen" class="screen active"><img src="assets/innovine-logo.png" alt="Innovine Logo"></div>
<div id="gameScreen" class="screen">
  <div class="header"><h1>Shape Puzzle Fit</h1><p>Drag the shape and fit it in the matching outline.</p></div>
  <div class="gameArea" id="gameArea">
    <div class="topShapes" id="topShapes"></div>
    <div class="outlines">
      <div class="outline" id="outline-circle"><img src="assets/circle-outline.png"></div>
      <div class="outline" id="outline-triangle"><img src="assets/triangle-outline.png"></div>
      <div class="outline" id="outline-square"><img src="assets/square-outline.png"></div>
    </div>
  </div>
</div>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<script>
const shapesData=[
  {type:'circle', img:'assets/circle.png'},
  {type:'circle', img:'assets/circle.png'},
  {type:'triangle', img:'assets/triangle.png'},
  {type:'triangle', img:'assets/triangle.png'},
  {type:'square', img:'assets/square.png'},
  {type:'square', img:'assets/square.png'}
];
const topShapes=document.getElementById('topShapes');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');
const logoScreen=document.getElementById('logoScreen');
const gameScreen=document.getElementById('gameScreen');

// Logo splash 5 sec
setTimeout(()=>{logoScreen.classList.remove('active');gameScreen.classList.add('active'); initGame();},5000);

function initGame(){
  shapesData.forEach(shape=>{
    const el=document.createElement('img');
    el.src=shape.img;
    el.dataset.type=shape.type;
    topShapes.appendChild(el);

    let offsetX, offsetY, dragging=false;
    el.addEventListener('mousedown', startDrag);
    el.addEventListener('touchstart', startDrag);

    function startDrag(e){
      dragging=true;
      const rect=el.getBoundingClientRect();
      offsetX=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
      offsetY=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
      document.addEventListener('mousemove', drag);
      document.addEventListener('mouseup', drop);
      document.addEventListener('touchmove', drag);
      document.addEventListener('touchend', drop);
    }

    function drag(e){
      if(!dragging) return;
      e.preventDefault();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-offsetX;
      const y=(e.touches?e.touches[0].clientY:e.clientY)-offsetY;
      el.style.position='absolute';
      el.style.left=x+'px';
      el.style.top=y+'px';
      el.style.zIndex=100;
    }

    function drop(e){
      dragging=false;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', drop);
      document.removeEventListener('touchmove', drag);
      document.removeEventListener('touchend', drop);

      const outline=document.getElementById('outline-'+el.dataset.type);
      const outlineRect=outline.getBoundingClientRect();
      const elRect=el.getBoundingClientRect();

      if(elRect.left+elRect.width/2>outlineRect.left && elRect.left+elRect.width/2<outlineRect.right && elRect.top+elRect.height/2>outlineRect.top && elRect.top+elRect.height/2<outlineRect.bottom){
        el.style.left=outlineRect.left+'px';
        el.style.top=outlineRect.top+'px';
        el.style.pointerEvents='none';
        correctSound.play();
        outline.style.backgroundColor='#c8f7c5';
      } else {
        wrongSound.play();
        el.style.position='relative';
        el.style.left='';
        el.style.top='';
        el.style.zIndex='';
      }
    }
  });
}
</script>
</body>
</html>
