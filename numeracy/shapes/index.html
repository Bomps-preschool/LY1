<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop Game</title>
<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', sans-serif;
        background-color: #e0f0f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    #logoSlide, #gameSlide, #endSlide {
        position: absolute;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    #logoSlide img {
        width: 250px;
    }
    #gameSlide {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #instructions {
        font-size: 1.5em;
        margin-bottom: 20px;
        text-align: center;
    }
    #dropArea {
        display: flex;
        justify-content: center;
        gap: 100px;
        margin-bottom: 50px;
    }
    .outline {
        width: 120px;
        height: 120px;
        border: 3px dashed #555;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }
    #shapes {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .shape {
        width: 100px;
        height: 100px;
        cursor: grab;
    }
    #endSlide {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-size: 2em;
    }
    #playAgain {
        padding: 10px 25px;
        font-size: 1em;
        margin-top: 20px;
        background-color: #4caf50;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 5px;
    }
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: red;
        top: 0;
        animation: fall linear;
    }
    @keyframes fall {
        0% { top: -20px; transform: rotate(0deg); }
        100% { top: 100vh; transform: rotate(360deg); }
    }
</style>
</head>
<body>

<!-- Logo Slide -->
<div id="logoSlide">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Slide -->
<div id="gameSlide">
    <div id="instructions">
        Count the shapes and drag to the correct outline<br>Tap on the shapes
    </div>
    <div id="dropArea">
        <div class="outline" id="triangleOutline" style="background-image: url('assets/triangle-outline.png');"></div>
        <div class="outline" id="squareOutline" style="background-image: url('assets/square-outline.png');"></div>
        <div class="outline" id="circleOutline" style="background-image: url('assets/circle-outline.png');"></div>
    </div>
    <div id="shapes">
        <img src="assets/triangle.png" draggable="true" class="shape" data-shape="triangle">
        <img src="assets/triangle.png" draggable="true" class="shape" data-shape="triangle">
        <img src="assets/square.png" draggable="true" class="shape" data-shape="square">
        <img src="assets/square.png" draggable="true" class="shape" data-shape="square">
        <img src="assets/circle.png" draggable="true" class="shape" data-shape="circle">
        <img src="assets/circle.png" draggable="true" class="shape" data-shape="circle">
    </div>
</div>

<!-- End Slide -->
<div id="endSlide">
    Well Done!
    <button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
    const logoSlide = document.getElementById('logoSlide');
    const gameSlide = document.getElementById('gameSlide');
    const endSlide = document.getElementById('endSlide');
    const playAgain = document.getElementById('playAgain');

    // Show logo first for 5 seconds
    logoSlide.style.display = 'flex';
    setTimeout(() => {
        logoSlide.style.display = 'none';
        gameSlide.style.display = 'flex';
    }, 5000);

    const shapes = document.querySelectorAll('.shape');
    const outlines = document.querySelectorAll('.outline');
    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');

    shapes.forEach(shape => {
        shape.addEventListener('dragstart', dragStart);
    });

    outlines.forEach(outline => {
        outline.addEventListener('dragover', dragOver);
        outline.addEventListener('drop', dropShape);
    });

    let draggedShape = null;

    function dragStart(e) {
        draggedShape = e.target;
    }

    function dragOver(e) {
        e.preventDefault();
    }

    function dropShape(e) {
        const outlineType = e.target.id.replace('Outline','').toLowerCase();
        if(draggedShape.dataset.shape === outlineType){
            // Correct
            correctSound.play();
            draggedShape.style.display = 'none'; // disappear when dropped
            checkAllPlaced();
        } else {
            wrongSound.play();
        }
    }

    function checkAllPlaced() {
        const remaining = Array.from(shapes).some(s => s.style.display !== 'none');
        if(!remaining) {
            showConfetti();
            gameSlide.style.display = 'none';
            endSlide.style.display = 'flex';
        }
    }

    playAgain.addEventListener('click', () => {
        location.reload();
    });

    function showConfetti() {
        for(let i=0;i<50;i++){
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random()*window.innerWidth+'px';
            confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
            confetti.style.animationDuration = (2+Math.random()*3)+'s';
            document.body.appendChild(confetti);
        }
    }
</script>
</body>
</html>
