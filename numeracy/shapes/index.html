<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop Game</title>
<style>
    body {
        font-family: 'Comic Sans MS', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #e0f0f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #logo-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #e0f0f8;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
    }

    #game-container {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 90%;
        max-width: 1000px;
        padding: 20px;
        background-color: #f8f4e0;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #instruction {
        font-size: 2rem;
        margin-bottom: 20px;
        text-align: center;
    }

    #shapes-row, #outlines-row {
        display: flex;
        justify-content: space-around;
        width: 100%;
        margin: 20px 0;
        flex-wrap: wrap;
    }

    .draggable, .outline {
        width: 120px;
        height: 120px;
        background-color: white;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px;
    }

    .draggable img, .outline img {
        max-width: 100px;
        max-height: 100px;
    }

    #well-done {
        display: none;
        text-align: center;
    }

    #well-done button {
        font-size: 1.5rem;
        padding: 10px 20px;
        margin-top: 20px;
        border: none;
        border-radius: 10px;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
    }

</style>
</head>
<body>

<!-- Innovine Logo -->
<div id="logo-container">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" style="width: 300px;">
</div>

<!-- Game Container -->
<div id="game-container">
    <div id="instruction">
        Count the shapes and drag to the correct outline<br>
        Tap on the shapes
    </div>

    <!-- Outline Row -->
    <div id="outlines-row">
        <div class="outline" data-shape="triangle">
            <img src="assets/triangle-outline.png" alt="Triangle Outline">
        </div>
        <div class="outline" data-shape="square">
            <img src="assets/square-outline.png" alt="Square Outline">
        </div>
        <div class="outline" data-shape="circle">
            <img src="assets/circle-outline.png" alt="Circle Outline">
        </div>
    </div>

    <!-- Shapes Row -->
    <div id="shapes-row">
        <div class="draggable" draggable="true" data-shape="triangle">
            <img src="assets/triangle.png" alt="Triangle">
        </div>
        <div class="draggable" draggable="true" data-shape="triangle">
            <img src="assets/triangle.png" alt="Triangle">
        </div>
        <div class="draggable" draggable="true" data-shape="square">
            <img src="assets/square.png" alt="Square">
        </div>
        <div class="draggable" draggable="true" data-shape="square">
            <img src="assets/square.png" alt="Square">
        </div>
        <div class="draggable" draggable="true" data-shape="circle">
            <img src="assets/circle.png" alt="Circle">
        </div>
        <div class="draggable" draggable="true" data-shape="circle">
            <img src="assets/circle.png" alt="Circle">
        </div>
    </div>
</div>

<!-- Well Done Slide -->
<div id="well-done">
    <h1>Well Done!</h1>
    <button onclick="location.reload()">Play Again</button>
</div>

<script>
    // Show Innovine logo for 5 seconds
    window.addEventListener("load", () => {
        setTimeout(() => {
            document.getElementById("logo-container").style.display = "none";
            document.getElementById("game-container").style.display = "flex";
        }, 5000);
    });

    const draggables = document.querySelectorAll('.draggable');
    const outlines = document.querySelectorAll('.outline');
    let correctCount = 0;

    draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', draggable.dataset.shape);
        });
    });

    outlines.forEach(outline => {
        outline.addEventListener('dragover', e => e.preventDefault());
        outline.addEventListener('drop', e => {
            const shape = e.dataTransfer.getData('text/plain');
            if (shape === outline.dataset.shape) {
                outline.innerHTML = `<img src="assets/${shape}.png" alt="${shape}">`;
                correctCount++;
                if (correctCount === draggables.length) {
                    document.getElementById('game-container').style.display = 'none';
                    document.getElementById('well-done').style.display = 'block';
                }
            } else {
                // Play wrong sound
                new Audio('assets/wrong.mp3').play();
            }
        });
    });
</script>
</body>
</html>
