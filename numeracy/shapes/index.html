<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag & Drop Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background-color: #d7eaf0; /* calm pastel background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .slide { display: none; width: 100%; max-width: 800px; text-align: center; position: relative; }
  .active { display: block; }
  #logoSlide img { max-width: 250px; margin-top: 100px; }
  #gameSlide {
    background-color: #f8f2e7;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  h2 { font-size: 24px; margin-bottom: 10px; }
  #instruction { font-size: 18px; margin-bottom: 30px; }
  .outlines { display: flex; justify-content: center; gap: 80px; margin-bottom: 50px; }
  .outline {
    width: 130px; height: 130px; border: 4px dashed #888; border-radius: 15px;
    display: flex; justify-content: center; align-items: center;
  }
  .outline img { width: 80px; height: 80px; pointer-events: none; }
  .shapes-container { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
  .shape {
    width: 80px; height: 80px; background-color: white; display: flex;
    justify-content: center; align-items: center; cursor: grab; border-radius: 15px;
  }
  .shape img { width: 60px; height: 60px; }
  #wellDoneSlide {
    background-color: #f8f2e7;
    padding: 50px;
    border-radius: 20px;
    position: relative;
  }
  #wellDoneSlide img { max-width: 200px; }
  button {
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #playAgainBtn { background-color: #88b04b; color: white; }
  #confetti {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    overflow: hidden;
  }
  .confetti { position: absolute; width: 10px; height: 10px; background-color: #fbc02d; opacity: 0.8; border-radius: 50%; }
</style>
</head>
<body>

<!-- Slide 1: Logo -->
<div id="logoSlide" class="slide active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Slide 2: Game -->
<div id="gameSlide" class="slide">
  <h2>Count the shapes and drag to the correct outline</h2>
  <p id="instruction">Tap on the shapes</p>
  <div class="outlines">
    <div class="outline" data-shape="triangle"><img src="assets/triangle-outline.png" alt="Triangle Outline"></div>
    <div class="outline" data-shape="square"><img src="assets/square-outline.png" alt="Square Outline"></div>
    <div class="outline" data-shape="circle"><img src="assets/circle-outline.png" alt="Circle Outline"></div>
  </div>
  <div class="shapes-container">
    <div class="shape" draggable="true" data-shape="triangle"><img src="assets/triangle.png" alt="Triangle"></div>
    <div class="shape" draggable="true" data-shape="triangle"><img src="assets/triangle.png" alt="Triangle"></div>
    <div class="shape" draggable="true" data-shape="square"><img src="assets/square.png" alt="Square"></div>
    <div class="shape" draggable="true" data-shape="square"><img src="assets/square.png" alt="Square"></div>
    <div class="shape" draggable="true" data-shape="circle"><img src="assets/circle.png" alt="Circle"></div>
    <div class="shape" draggable="true" data-shape="circle"><img src="assets/circle.png" alt="Circle"></div>
  </div>
</div>

<!-- Slide 3: Well Done -->
<div id="wellDoneSlide" class="slide">
  <h2>Well Done!</h2>
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
  <br>
  <button id="playAgainBtn">Play Again</button>
</div>

<!-- Confetti -->
<div id="confetti"></div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const logoSlide = document.getElementById('logoSlide');
const gameSlide = document.getElementById('gameSlide');
const wellDoneSlide = document.getElementById('wellDoneSlide');
const playAgainBtn = document.getElementById('playAgainBtn');
const shapes = document.querySelectorAll('.shape');
const outlines = document.querySelectorAll('.outline');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
let placed = 0;

// Show game after 5 seconds
setTimeout(() => {
  logoSlide.classList.remove('active');
  gameSlide.classList.add('active');
}, 5000);

// Drag and Drop
shapes.forEach(shape => {
  shape.addEventListener('dragstart', e => {
    e.dataTransfer.setData('shape', e.target.dataset.shape);
  });
});

outlines.forEach(outline => {
  outline.addEventListener('dragover', e => e.preventDefault());
  outline.addEventListener('drop', e => {
    e.preventDefault();
    const shapeType = e.dataTransfer.getData('shape');
    if (shapeType === outline.dataset.shape) {
      const img = document.querySelector(`.shape[data-shape="${shapeType}"] img`);
      outline.appendChild(img);
      img.parentElement.remove();
      correctSound.play();
      placed++;
      if (placed === 6) {
        gameSlide.classList.remove('active');
        wellDoneSlide.classList.add('active');
        startConfetti();
      }
    } else {
      wrongSound.play();
    }
  });
});

// Play Again
playAgainBtn.addEventListener('click', () => {
  location.reload();
});

// Confetti
function startConfetti() {
  const confettiContainer = document.getElementById('confetti');
  confettiContainer.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const conf = document.createElement('div');
    conf.classList.add('confetti');
    conf.style.left = Math.random() * window.innerWidth + 'px';
    conf.style.backgroundColor = `hsl(${Math.random()*360},70%,60%)`;
    confettiContainer.appendChild(conf);
    animateConfetti(conf);
  }
}

function animateConfetti(el) {
  let top = -10;
  const speed = Math.random() * 3 + 2;
  const left = parseFloat(el.style.left);
  const angle = Math.random() * Math.PI * 2;
  const deltaX = Math.cos(angle) * speed;
  const deltaY = Math.sin(angle) * speed + 2;
  function frame() {
    top += deltaY;
    el.style.top = top + 'px';
    el.style.left = (parseFloat(el.style.left) + deltaX) + 'px';
    if (top < window.innerHeight) requestAnimationFrame(frame);
    else el.remove();
  }
  frame();
}
</script>
</body>
</html>
