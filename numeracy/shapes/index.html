<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag & Drop Game</title>
<style>
  body {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background-color: #e8f1f5;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game-container, #logo-container, #celebration-container {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #logo-container img {
    width: 250px;
  }

  #game-box {
    background-color: #fff8e8;
    border-radius: 20px;
    padding: 20px;
    width: 90%;
    max-width: 900px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h2 {
    text-align: center;
    margin: 0 0 10px 0;
    font-size: 1.5rem;
  }

  .outlines {
    display: flex;
    justify-content: space-around;
    width: 100%;
    margin: 20px 0;
  }

  .outline {
    width: 120px;
    height: 120px;
    border: 4px dashed #555;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .draggables {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 10px;
  }

  .draggable {
    width: 100px;
    height: 100px;
    border-radius: 15px;
    background-color: #fff;
    padding: 5px;
    cursor: grab;
  }

  .hidden {
    display: none !important;
  }

  #celebration-container {
    background-color: #e8f1f5;
    z-index: 10;
  }

  #celebration-container h1 {
    font-size: 3rem;
    color: #000;
    margin-bottom: 20px;
  }

  #celebration-container button {
    padding: 12px 30px;
    font-size: 1.2rem;
    border: none;
    border-radius: 8px;
    background-color: #4CAF50;
    color: #fff;
    cursor: pointer;
  }

  canvas {
    position: absolute;
    top:0; left:0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

</style>
</head>
<body>

<!-- Logo Slide -->
<div id="logo-container">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Container -->
<div id="game-container">
  <div id="game-box">
    <h2>Count the shapes and drag to the correct outline<br>Tap on the shapes</h2>
    <div class="outlines">
      <div class="outline" data-shape="triangle"><img src="assets/triangle-outline.png" alt="Triangle" width="100"></div>
      <div class="outline" data-shape="square"><img src="assets/square-outline.png" alt="Square" width="100"></div>
      <div class="outline" data-shape="circle"><img src="assets/circle-outline.png" alt="Circle" width="100"></div>
    </div>
    <div class="draggables">
      <img src="assets/triangle.png" class="draggable" draggable="true" data-shape="triangle">
      <img src="assets/triangle.png" class="draggable" draggable="true" data-shape="triangle">
      <img src="assets/square.png" class="draggable" draggable="true" data-shape="square">
      <img src="assets/square.png" class="draggable" draggable="true" data-shape="square">
      <img src="assets/circle.png" class="draggable" draggable="true" data-shape="circle">
      <img src="assets/circle.png" class="draggable" draggable="true" data-shape="circle">
    </div>
  </div>
</div>

<!-- Celebration Slide -->
<div id="celebration-container">
  <h1>Well Done!</h1>
  <button onclick="restartGame()">Play Again</button>
</div>

<canvas id="confetti"></canvas>

<!-- Sounds -->
<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
  const logoSlide = document.getElementById('logo-container');
  const gameSlide = document.getElementById('game-container');
  const celebrationSlide = document.getElementById('celebration-container');
  const draggables = document.querySelectorAll('.draggable');
  const outlines = document.querySelectorAll('.outline');

  let draggedItem = null;

  function shuffleDraggables() {
    const container = document.querySelector('.draggables');
    for (let i = container.children.length; i >= 0; i--) {
      container.appendChild(container.children[Math.random() * i | 0]);
    }
  }

  function startGame() {
    logoSlide.style.display = 'flex';
    setTimeout(() => {
      logoSlide.style.display = 'none';
      gameSlide.style.display = 'flex';
      shuffleDraggables();
    }, 5000);
  }

  draggables.forEach(item => {
    item.addEventListener('dragstart', e => {
      draggedItem = e.target;
    });
  });

  outlines.forEach(outline => {
    outline.addEventListener('dragover', e => e.preventDefault());
    outline.addEventListener('drop', e => {
      if (draggedItem.dataset.shape === outline.dataset.shape) {
        draggedItem.classList.add('hidden'); // disappear immediately
        playSound('correct');
        checkCompletion();
      } else {
        playSound('wrong');
      }
    });
  });

  function playSound(type) {
    if (type === 'correct') document.getElementById('correct-sound').play();
    else document.getElementById('wrong-sound').play();
  }

  function checkCompletion() {
    const remaining = Array.from(draggables).filter(d => !d.classList.contains('hidden'));
    if (!remaining.some(d => !d.classList.contains('hidden'))) {
      gameSlide.style.display = 'none';
      celebrationSlide.style.display = 'flex';
      startConfetti();
    }
  }

  function restartGame() {
    celebrationSlide.style.display = 'none';
    draggables.forEach(d => d.classList.remove('hidden'));
    gameSlide.style.display = 'flex';
    stopConfetti();
    shuffleDraggables();
  }

  // Confetti setup
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  let confettiParticles = [];

  function createConfetti() {
    confettiParticles = [];
    for (let i = 0; i < 150; i++) {
      confettiParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 30,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        tilt: Math.random() * 10 - 10
      });
    }
  }

  function drawConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(p.x + p.tilt, p.y);
      ctx.lineTo(p.x + p.tilt + p.r/2, p.y + p.r);
      ctx.lineTo(p.x + p.tilt - p.r/2, p.y + p.r);
      ctx.fillStyle = p.color;
      ctx.fill();
    });
    updateConfetti();
    requestAnimationFrame(drawConfetti);
  }

  function updateConfetti() {
    confettiParticles.forEach(p => {
      p.y += Math.cos(0.01 + p.d) + 2 + p.r/2;
      p.x += Math.sin(0.01);
      if (p.y > canvas.height) p.y = -10;
    });
  }

  function startConfetti() {
    createConfetti();
    drawConfetti();
  }

  function stopConfetti() {
    confettiParticles = [];
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  window.onload = startGame;
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
