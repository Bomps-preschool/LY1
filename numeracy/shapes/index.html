<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background-color: #d9ecf2;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #logoScreen, #gameScreen, #winScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 90vw;
    max-width: 1200px;
  }

  #logoScreen img {
    width: 50vw;
    max-width: 300px;
    height: auto;
  }

  #gameScreen {
    background-color: #f9f3e9;
    padding: 2vw;
    border-radius: 2vw;
    text-align: center;
    box-sizing: border-box;
  }

  .outline-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5vw;
    margin-bottom: 4vh;
  }

  .outline-box {
    width: 20vw;
    max-width: 150px;
    aspect-ratio: 1 / 1;
    border: 4px dashed #555;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 1vw;
    position: relative;
    transition: transform 0.2s;
  }

  .outline-box img {
    width: 80%;
    height: 80%;
    pointer-events: none;
  }

  .outline-box.highlight {
    transform: scale(1.1);
    border-color: #4CAF50;
  }

  .shapes-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4vw;
  }

  .draggable-shape {
    width: 18vw;
    max-width: 120px;
    aspect-ratio: 1 / 1;
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    border-radius: 1vw;
    touch-action: none;
    position: relative;
    transition: transform 0.1s;
  }

  .draggable-shape img {
    width: 90%;
    height: 90%;
    user-select: none;
    pointer-events: none;
  }

  #winScreen {
    text-align: center;
  }

  #winScreen button {
    padding: 1vh 2vw;
    font-size: 2vw;
    border: none;
    border-radius: 1vw;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
  }

  #winScreen button:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <h2>Count the shapes and drag to the correct outline</h2>
  <p>Tap or drag the shapes to match the outline</p>
  <div class="outline-container">
    <div class="outline-box" data-shape="triangle">
      <img src="assets/triangle-outline.png" alt="Triangle Outline">
    </div>
    <div class="outline-box" data-shape="square">
      <img src="assets/square-outline.png" alt="Square Outline">
    </div>
    <div class="outline-box" data-shape="circle">
      <img src="assets/circle-outline.png" alt="Circle Outline">
    </div>
  </div>
  <div class="shapes-row">
    <div class="draggable-shape" draggable="true" data-shape="square">
      <img src="assets/square.png" alt="Square">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="triangle">
      <img src="assets/triangle.png" alt="Triangle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="circle">
      <img src="assets/circle.png" alt="Circle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="triangle">
      <img src="assets/triangle.png" alt="Triangle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="circle">
      <img src="assets/circle.png" alt="Circle">
    </div>
    <div class="draggable-shape" draggable="true" data-shape="square">
      <img src="assets/square.png" alt="Square">
    </div>
  </div>
</div>

<div id="winScreen">
  <h1>Well Done!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/claps.mp3"></audio>

<script>
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const winScreen = document.getElementById('winScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

let draggedShape = null;
let totalShapes = document.querySelectorAll('.draggable-shape').length;
let correctDrops = 0;

// Start game
function startGame() {
  logoScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  winScreen.style.display = 'none';
  setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
  }, 3000);
}

// Desktop Drag & Drop
document.querySelectorAll('.draggable-shape').forEach(shape => {
  shape.addEventListener('dragstart', e => { draggedShape = shape; });
});

document.querySelectorAll('.outline-box').forEach(box => {
  box.addEventListener('dragover', e => e.preventDefault());
  box.addEventListener('drop', e => handleDrop(box));
});

// Mobile Touch Support
document.querySelectorAll('.draggable-shape').forEach(shape => {
  shape.addEventListener('touchstart', e => {
    draggedShape = shape;
    shape.style.position = 'absolute';
    shape.style.zIndex = 1000;
  });

  shape.addEventListener('touchmove', e => {
    e.preventDefault();
    let touch = e.touches[0];
    shape.style.left = touch.clientX - shape.offsetWidth/2 + 'px';
    shape.style.top = touch.clientY - shape.offsetHeight/2 + 'px';
  });

  shape.addEventListener('touchend', e => {
    let touch = e.changedTouches[0];
    let drop = null;
    document.querySelectorAll('.outline-box').forEach(box => {
      let rect = box.getBoundingClientRect();
      if (
        touch.clientX >= rect.left &&
        touch.clientX <= rect.right &&
        touch.clientY >= rect.top &&
        touch.clientY <= rect.bottom
      ) {
        drop = box;
      }
      box.classList.remove('highlight');
    });
    if (drop) handleDrop(drop);
    shape.style.position = 'relative';
    shape.style.left = '0px';
    shape.style.top = '0px';
    draggedShape = null;
  });
});

// Highlight outlines while dragging
document.querySelectorAll('.outline-box').forEach(box => {
  box.addEventListener('dragenter', () => box.classList.add('highlight'));
  box.addEventListener('dragleave', () => box.classList.remove('highlight'));
});

function handleDrop(box) {
  if (!draggedShape) return;
  const shapeType = draggedShape.dataset.shape;
  const boxType = box.dataset.shape;
  if (shapeType === boxType) {
    draggedShape.style.display = 'none';
    correctSound.play();
    correctDrops++;
    if (correctDrops === totalShapes) {
      setTimeout(showWinScreen, 500);
    }
  } else {
    wrongSound.play();
  }
}

// Win Screen
function showWinScreen() {
  gameScreen.style.display = 'none';
  winScreen.style.display = 'flex';
}

playAgainBtn.addEventListener('click', () => {
  document.querySelectorAll('.draggable-shape').forEach(s => s.style.display = 'flex');
  correctDrops = 0;
  startGame();
});

startGame();
</script>
</body>
</html>
