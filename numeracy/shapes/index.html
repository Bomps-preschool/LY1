<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop Game</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #e1f0f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #logoSlide, #gameSlide, #wellDoneSlide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #logoSlide img {
    width: 200px;
  }
  #gameContainer {
    background: #f9f5e8;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
  }
  .outlineBox {
    display: inline-block;
    width: 120px;
    height: 120px;
    border: 3px dashed #555;
    margin: 20px;
    vertical-align: top;
    position: relative;
  }
  .shape {
    width: 100px;
    height: 100px;
    margin: 10px;
    display: inline-block;
    cursor: grab;
    border-radius: 8px;
  }
  #shapesContainer {
    margin-top: 30px;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #playAgainBtn {
    background-color: #4caf50;
    color: white;
  }
</style>
</head>
<body>

<!-- Logo Slide -->
<div id="logoSlide">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Slide -->
<div id="gameSlide">
  <div id="gameContainer">
    <h2>Count the shapes and drag to the correct outline</h2>
    <h3>Tap on the shapes</h3>
    <div id="outlineContainer">
      <div class="outlineBox" data-shape="triangle">
        <img src="assets/triangle-outline.png" style="width:100%; height:100%;">
      </div>
      <div class="outlineBox" data-shape="square">
        <img src="assets/square-outline.png" style="width:100%; height:100%;">
      </div>
      <div class="outlineBox" data-shape="circle">
        <img src="assets/circle-outline.png" style="width:100%; height:100%;">
      </div>
    </div>
    <div id="shapesContainer">
      <div class="shape" draggable="true" data-shape="triangle" style="background-image:url('assets/triangle.png'); background-size:cover;"></div>
      <div class="shape" draggable="true" data-shape="triangle" style="background-image:url('assets/triangle.png'); background-size:cover;"></div>
      <div class="shape" draggable="true" data-shape="square" style="background-image:url('assets/square.png'); background-size:cover;"></div>
      <div class="shape" draggable="true" data-shape="square" style="background-image:url('assets/square.png'); background-size:cover;"></div>
      <div class="shape" draggable="true" data-shape="circle" style="background-image:url('assets/circle.png'); background-size:cover;"></div>
      <div class="shape" draggable="true" data-shape="circle" style="background-image:url('assets/circle.png'); background-size:cover;"></div>
    </div>
  </div>
</div>

<!-- Well Done Slide -->
<div id="wellDoneSlide">
  <h1>Well Done!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const logoSlide = document.getElementById('logoSlide');
const gameSlide = document.getElementById('gameSlide');
const wellDoneSlide = document.getElementById('wellDoneSlide');
const shapes = document.querySelectorAll('.shape');
const outlineBoxes = document.querySelectorAll('.outlineBox');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const playAgainBtn = document.getElementById('playAgainBtn');

let correctCount = 0;

// Show logo first
logoSlide.style.display = 'flex';
setTimeout(() => {
  logoSlide.style.display = 'none';
  gameSlide.style.display = 'flex';
}, 5000);

// Drag and drop
shapes.forEach(shape => {
  shape.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', shape.dataset.shape);
    e.dataTransfer.setData('text/id', shape.style.backgroundImage);
  });
});

outlineBoxes.forEach(box => {
  box.addEventListener('dragover', e => e.preventDefault());
  box.addEventListener('drop', e => {
    e.preventDefault();
    const draggedShape = e.dataTransfer.getData('text/plain');
    const draggedImage = e.dataTransfer.getData('text/id');
    if (draggedShape === box.dataset.shape) {
      correctSound.play();
      correctCount++;
      // Hide dragged shape
      shapes.forEach(s => {
        if(s.style.backgroundImage === draggedImage) s.style.display = 'none';
      });
      if (correctCount === shapes.length / 2) {
        gameSlide.style.display = 'none';
        wellDoneSlide.style.display = 'flex';
      }
    } else {
      wrongSound.play();
    }
  });
});

playAgainBtn.addEventListener('click', () => {
  location.reload();
});
</script>

</body>
</html>
