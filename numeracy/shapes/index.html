<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Puzzle Fit</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; font-family:"Comic Sans MS","Arial Rounded MT Bold",sans-serif; overflow:hidden; }
.screen { width:100vw; height:100vh; display:none; flex-direction:column; align-items:center; justify-content:center; }
.active { display:flex; }
#logoScreen { background:white; align-items:center; justify-content:center; }
#logoScreen img { width:min(300px,70vw); }
#gameScreen { flex-direction:column; width:100%; align-items:center; position:relative; background: url('assets/d97129a7-954d-42b4-8a30-2ea13b2a469f.png') no-repeat center/cover; }
.header { width:100%; text-align:center; margin-bottom:12px; }
.header h1 { font-size:clamp(24px,5vw,40px); color:#6b2fa8; }
.header p { font-size:16px; color:#555; }
.gameArea { position:relative; width:100%; flex:1; display:flex; align-items:center; justify-content:center; }
.outline { position:absolute; width:150px; height:150px; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.outline img { width:100%; height:100%; }
#bottomShapes { position:absolute; bottom:20px; display:flex; justify-content:center; width:100%; gap:80px; }
#bottomShapes .basket { display:flex; flex-direction:column; align-items:center; }
#bottomShapes img { width:120px; height:120px; cursor:pointer; border-radius:12px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 0.2s; }
#bottomShapes span { margin-top:8px; font-size:18px; font-weight:bold; color:#333; }
.smallShape { width:80px; height:80px; position:absolute; cursor:pointer; transition: transform 0.2s; }
.smallShape:active { transform: scale(1.1); }
</style>
</head>
<body>
<div id="logoScreen" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>
<div id="gameScreen" class="screen">
  <div class="header">
    <h1>Shape Puzzle Fit</h1>
    <p>Drag the shape and fit it in the matching outline.</p>
  </div>
  <div class="gameArea" id="gameArea">
    <!-- Outlines -->
    <div class="outline" id="outline-circle" style="left:20%; top:20%;"><img src="assets/circle-outline.png"></div>
    <div class="outline" id="outline-triangle" style="left:50%; top:20%;"><img src="assets/triangle-outline.png"></div>
    <div class="outline" id="outline-square" style="left:80%; top:20%;"><img src="assets/square-outline.png"></div>
  </div>
  <div id="bottomShapes">
    <div class="basket">
      <img src="assets/circle.png" data-type="circle">
      <span>Circle</span>
    </div>
    <div class="basket">
      <img src="assets/triangle.png" data-type="triangle">
      <span>Triangle</span>
    </div>
    <div class="basket">
      <img src="assets/square.png" data-type="square">
      <span>Square</span>
    </div>
  </div>
</div>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<script>
const bottomShapes = document.querySelectorAll('#bottomShapes img');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');

// Logo splash for 5 seconds
setTimeout(()=>{ logoScreen.classList.remove('active'); gameScreen.classList.add('active'); },5000);

// Drag & Drop
bottomShapes.forEach(shape => {
    let offsetX, offsetY, dragging=false;
    shape.addEventListener('mousedown', startDrag);
    shape.addEventListener('touchstart', startDrag);

    function startDrag(e){
        dragging=true;
        const rect = shape.getBoundingClientRect();
        offsetX = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
        offsetY = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', drop);
        document.addEventListener('touchmove', drag);
        document.addEventListener('touchend', drop);
    }

    function drag(e){
        if(!dragging) return;
        e.preventDefault();
        const x = (e.touches? e.touches[0].clientX : e.clientX) - offsetX;
        const y = (e.touches? e.touches[0].clientY : e.clientY) - offsetY;
        shape.style.position='absolute';
        shape.style.left = x + 'px';
        shape.style.top = y + 'px';
        shape.style.zIndex = 100;
    }

    function drop(e){
        dragging=false;
        document.removeEventListener('mousemove', drag);
        document.removeEventListener('mouseup', drop);
        document.removeEventListener('touchmove', drag);
        document.removeEventListener('touchend', drop);

        const outline = document.getElementById('outline-'+shape.dataset.type);
        const outlineRect = outline.getBoundingClientRect();
        const shapeRect = shape.getBoundingClientRect();

        if(shapeRect.left + shapeRect.width/2 > outlineRect.left &&
           shapeRect.left + shapeRect.width/2 < outlineRect.right &&
           shapeRect.top + shapeRect.height/2 > outlineRect.top &&
           shapeRect.top + shapeRect.height/2 < outlineRect.bottom){
               shape.style.left = outlineRect.left + 'px';
               shape.style.top = outlineRect.top + 'px';
               shape.style.pointerEvents='none';
               correctSound.play();
               outline.style.backgroundColor = '#c8f7c5';
        } else {
               wrongSound.play();
               shape.style.position='relative';
               shape.style.left='';
               shape.style.top='';
               shape.style.zIndex='';
        }
    }
});
</script>
</body>
</html>
