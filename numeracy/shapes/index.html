<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag and Drop Game</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    background-color: #E8F0F2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #logoSlide, #gameSlide, #finalSlide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #logoSlide img {
    width: 250px;
    height: auto;
  }
  #gameSlide {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .drop-container {
    display: flex;
    justify-content: space-around;
    margin-top: 50px;
    width: 80%;
  }
  .outline {
    width: 120px;
    height: 120px;
    border: 4px dashed #555;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 20px;
  }
  .draggable-container {
    display: flex;
    justify-content: center;
    margin-top: 50px;
    flex-wrap: wrap;
    width: 80%;
  }
  .draggable {
    width: 100px;
    height: 100px;
    margin: 15px;
    cursor: grab;
    touch-action: none;
  }
  #finalSlide {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #finalSlide button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 30px;
    cursor: pointer;
  }
  canvas {
    position: absolute;
    top:0;
    left:0;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Innovine Logo Slide -->
<div id="logoSlide">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Slide -->
<div id="gameSlide">
  <h2 style="text-align:center;">Count the shapes and drag to the correct outline<br><small>Tap on the shapes</small></h2>
  <div class="drop-container">
    <div class="outline" data-shape="triangle"><img src="assets/triangle-outline.png" style="width:100%; height:100%;"></div>
    <div class="outline" data-shape="square"><img src="assets/square-outline.png" style="width:100%; height:100%;"></div>
    <div class="outline" data-shape="circle"><img src="assets/circle-outline.png" style="width:100%; height:100%;"></div>
  </div>
  <div class="draggable-container" id="draggables"></div>
</div>

<!-- Final Slide -->
<div id="finalSlide">
  <h1>Well Done!</h1>
  <canvas id="confettiCanvas"></canvas>
  <button onclick="restartGame()">Play Again</button>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/claps.mp3"></audio>

<script>
const shapes = ["triangle","triangle","square","square","circle","circle"];
let logoSlide = document.getElementById("logoSlide");
let gameSlide = document.getElementById("gameSlide");
let finalSlide = document.getElementById("finalSlide");
let draggablesContainer = document.getElementById("draggables");
let correctSound = document.getElementById("correctSound");
let wrongSound = document.getElementById("wrongSound");
let clapSound = document.getElementById("clapSound");

// Confetti
let canvas = document.getElementById("confettiCanvas");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let ctx = canvas.getContext("2d");
let confettiPieces = [];
function createConfetti() {
  for(let i=0;i<150;i++){
    confettiPieces.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*6+2,
      d: Math.random()*150+10,
      color: `hsl(${Math.random()*360}, 70%, 60%)`,
      tilt: Math.random()*10-10
    });
  }
}
function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiPieces.forEach(p=>{
    ctx.beginPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = p.color;
    ctx.moveTo(p.x+p.tilt,p.y);
    ctx.lineTo(p.x+p.tilt+5,p.y+p.r);
    ctx.stroke();
    p.y += 2 + Math.sin(p.d)*0.5;
    if(p.y > canvas.height){ p.y = -10; p.x = Math.random()*canvas.width; }
  });
  requestAnimationFrame(drawConfetti);
}

// Start Game after logo
logoSlide.style.display = "flex";
setTimeout(()=>{
  logoSlide.style.display = "none";
  startGame();
},5000);

function startGame(){
  gameSlide.style.display = "flex";
  loadDraggables();
}

function loadDraggables(){
  draggablesContainer.innerHTML = "";
  let shuffled = shapes.sort(()=>Math.random()-0.5);
  shuffled.forEach(shape=>{
    let img = document.createElement("img");
    img.src = `assets/${shape}.png`;
    img.draggable = true;
    img.className = "draggable";
    img.dataset.shape = shape;
    draggablesContainer.appendChild(img);
  });
  setupDragAndDrop();
}

function setupDragAndDrop(){
  let dragged;
  document.querySelectorAll(".draggable").forEach(drag=>{
    drag.addEventListener("dragstart",(e)=>{ dragged = e.target; });
  });
  document.querySelectorAll(".outline").forEach(out=>{
    out.addEventListener("dragover",(e)=>{ e.preventDefault(); });
    out.addEventListener("drop",(e)=>{
      if(dragged.dataset.shape === out.dataset.shape){
        out.appendChild(dragged);
        correctSound.play();
        checkCompletion();
      } else { wrongSound.play(); }
    });
  });
}

function checkCompletion(){
  let allCorrect = true;
  document.querySelectorAll(".draggable").forEach(d=>{
    if(d.parentNode.dataset.shape !== d.dataset.shape) allCorrect=false;
  });
  if(allCorrect){
    clapSound.play();
    gameSlide.style.display="none";
    finalSlide.style.display="flex";
    createConfetti();
    drawConfetti();
  }
}

function restartGame(){
  confettiPieces = [];
  finalSlide.style.display = "none";
  startGame();
}
</script>
</body>
</html>
