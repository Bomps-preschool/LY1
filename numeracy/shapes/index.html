<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes Drag & Drop Game</title>
<style>
    body {
        font-family: 'Comic Sans MS', cursive, sans-serif;
        margin: 0;
        background-color: #e0f0f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    #logo-slide, #game-slide, #well-done-slide {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: all 0.5s ease;
    }
    #logo-slide img {
        width: 300px;
        height: auto;
    }
    #game-slide {
        display: none;
        flex-direction: column;
        text-align: center;
    }
    #game-instructions {
        font-size: 1.5rem;
        margin-bottom: 30px;
    }
    #outline-container {
        display: flex;
        justify-content: space-around;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }
    .outline {
        width: 150px;
        height: 150px;
        border: 3px dashed #555;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px;
        position: relative;
    }
    .outline img {
        width: 80px;
        height: 80px;
        opacity: 0.5;
    }
    #shapes-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
    }
    .draggable-shape {
        width: 120px;
        height: 120px;
        background-color: white;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
        user-select: none;
        position: relative;
    }
    .draggable-shape img {
        width: 90px;
        height: 90px;
    }
    #well-done-slide {
        display: none;
        text-align: center;
        font-size: 2rem;
    }
    #well-done-slide button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
    }
    canvas.confetti {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
    }
</style>
</head>
<body>

<!-- Logo Slide -->
<div id="logo-slide">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Slide -->
<div id="game-slide">
    <div id="game-instructions">
        Count the shapes and drag to the correct outline<br>
        Tap on the shapes
    </div>
    <div id="outline-container">
        <div class="outline" data-shape="triangle"><img src="assets/triangle-outline.png" alt="Triangle Outline"></div>
        <div class="outline" data-shape="square"><img src="assets/square-outline.png" alt="Square Outline"></div>
        <div class="outline" data-shape="circle"><img src="assets/circle-outline.png" alt="Circle Outline"></div>
    </div>
    <div id="shapes-container">
        <div class="draggable-shape" data-shape="triangle"><img src="assets/triangle.png" alt="Triangle"></div>
        <div class="draggable-shape" data-shape="triangle"><img src="assets/triangle.png" alt="Triangle"></div>
        <div class="draggable-shape" data-shape="square"><img src="assets/square.png" alt="Square"></div>
        <div class="draggable-shape" data-shape="square"><img src="assets/square.png" alt="Square"></div>
        <div class="draggable-shape" data-shape="circle"><img src="assets/circle.png" alt="Circle"></div>
        <div class="draggable-shape" data-shape="circle"><img src="assets/circle.png" alt="Circle"></div>
    </div>
</div>

<!-- Well Done Slide -->
<div id="well-done-slide">
    Well Done!
    <button onclick="restartGame()">Play Again</button>
</div>

<audio id="correct-audio" src="assets/correct.mp3"></audio>
<audio id="wrong-audio" src="assets/wrong.mp3"></audio>

<canvas id="confetti-canvas" class="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const logoSlide = document.getElementById('logo-slide');
const gameSlide = document.getElementById('game-slide');
const wellDoneSlide = document.getElementById('well-done-slide');
const shapes = document.querySelectorAll('.draggable-shape');
const outlines = document.querySelectorAll('.outline');
const correctAudio = document.getElementById('correct-audio');
const wrongAudio = document.getElementById('wrong-audio');
let placedCount = 0;

// Show logo for 5 seconds then start game
setTimeout(() => {
    logoSlide.style.display = 'none';
    gameSlide.style.display = 'flex';
    randomizeShapes();
}, 5000);

// Randomize shapes position
function randomizeShapes() {
    const container = document.getElementById('shapes-container');
    for (let i = container.children.length; i >= 0; i--) {
        container.appendChild(container.children[Math.random() * i | 0]);
    }
}

// Drag & Drop
shapes.forEach(shape => {
    shape.addEventListener('dragstart', dragStart);
    shape.addEventListener('touchstart', touchStart);
});

outlines.forEach(outline => {
    outline.addEventListener('dragover', dragOver);
    outline.addEventListener('drop', drop);
    outline.addEventListener('touchend', touchDrop);
});

let dragged = null;

function dragStart(e) {
    dragged = e.target;
    e.dataTransfer?.setData('text/plain', dragged.dataset.shape);
}

function dragOver(e) {
    e.preventDefault();
}

function drop(e) {
    e.preventDefault();
    if (!dragged) return;
    const targetShape = e.currentTarget.dataset.shape;
    if (dragged.dataset.shape === targetShape) {
        dragged.remove(); // disappear immediately
        correctAudio.play();
        placedCount++;
        checkAllPlaced();
    } else {
        wrongAudio.play();
    }
    dragged = null;
}

// Touch support
function touchStart(e) {
    dragged = e.target;
}

function touchDrop(e) {
    const touch = e.changedTouches[0];
    const rect = e.currentTarget.getBoundingClientRect();
    const x = touch.clientX;
    const y = touch.clientY;
    if (
        x >= rect.left && x <= rect.right &&
        y >= rect.top && y <= rect.bottom
    ) {
        if (dragged.dataset.shape === e.currentTarget.dataset.shape) {
            dragged.remove();
            correctAudio.play();
            placedCount++;
            checkAllPlaced();
        } else {
            wrongAudio.play();
        }
    }
    dragged = null;
}

// Check all shapes placed
function checkAllPlaced() {
    if (placedCount === 6) {
        gameSlide.style.display = 'none';
        wellDoneSlide.style.display = 'flex';
        launchConfetti();
    }
}

// Restart game
function restartGame() {
    window.location.reload();
}

// Confetti
function launchConfetti() {
    const duration = 3000;
    const end = Date.now() + duration;

    const confettiCanvas = document.getElementById('confetti-canvas');

    (function frame() {
        confetti({
            particleCount: 5,
            spread: 120,
            origin: { y: 0 },
            startVelocity: 30,
            colors: ['#ff0','#f0f','#0ff','#0f0','#f90']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}
</script>
</body>
</html>
