<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle the Number Game</title>
<style>
  body {
    margin:0;
    font-family: 'Arial', sans-serif;
    background:#ffeccf;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }

  #logoScreen, #gameScreen, #scoreScreen {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:absolute;
    top:0; left:0;
  }

  #logoScreen img {
    width:200px;
  }

  #instruction {
    background: #fffca0;
    padding:10px 20px;
    border-radius:8px;
    font-size:22px;
    margin-bottom:20px;
    text-align:center;
  }

  #numbersBox {
    display:flex;
    flex-direction:column;
    gap:20px;
    background:#fff9e5;
    padding:20px;
    border-radius:15px;
  }

  .numberRow {
    display:flex;
    justify-content:center;
    gap:20px;
  }

  .number {
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    border:3px solid #000;
    border-radius:12px;
    background:white;
    cursor:pointer;
    user-select:none;
  }

  .number.correct { background:#a0ffaf; }
  .number.wrong { background:#ff9a9a; }

  #scoreScreen {
    background:#fff7e0;
    flex-direction:column;
    font-size:24px;
    display:none;
    align-items:center;
    justify-content:center;
  }

  #scoreScreen button {
    padding:10px 20px;
    font-size:20px;
    background:#ffdd57;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
  }

</style>
</head>
<body>

<!-- Innovine Logo Slide -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Count and circle the correct number</div>
  <div id="numbersBox">
    <div class="numberRow" id="row1"></div>
    <div class="numberRow" id="row2"></div>
  </div>
</div>

<!-- Score Screen -->
<div id="scoreScreen">
  <div id="scoreText"></div>
  <button id="playAgain">Play Again</button>
</div>

<script>
const slides = [
  { row1:[3,5,4,8], row2:[4,1,4,9], correct:[4,4,4] },
  { row1:[2,1,3,5], row2:[1,2,2,4], correct:[2,2,2] },
  { row1:[1,3,2,4], row2:[4,3,1,5], correct:[1,1,1] },
  { row1:[5,2,3,1], row2:[2,5,5,3], correct:[5,5,5] },
  { row1:[1,2,3,4], row2:[4,4,2,1], correct:[4,4,4] }
];

let currentSlide=0;
let correctClicks=0;

// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

// Show logo for 5s
window.onload = ()=>{
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadSlide(currentSlide);
  },5000);
};

function loadSlide(index){
  const slide = slides[index];
  correctClicks=0;

  const row1Div = document.getElementById("row1");
  const row2Div = document.getElementById("row2");
  row1Div.innerHTML="";
  row2Div.innerHTML="";

  slide.row1.forEach(n=>{
    const num = document.createElement("div");
    num.classList.add("number");
    num.textContent=n;
    num.addEventListener("click",()=>checkNumber(num, n, slide.correct));
    row1Div.appendChild(num);
  });

  slide.row2.forEach(n=>{
    const num = document.createElement("div");
    num.classList.add("number");
    num.textContent=n;
    num.addEventListener("click",()=>checkNumber(num, n, slide.correct));
    row2Div.appendChild(num);
  });
}

function checkNumber(element, number, correctArray){
  if(correctArray.includes(number)){
    element.classList.add("correct");
    correctSound.play();
    correctClicks++;
    // check if all correct numbers are circled
    if(correctClicks==correctArray.length){
      if(currentSlide<slides.length-1){
        currentSlide++;
        setTimeout(()=>loadSlide(currentSlide),600);
      }else{
        document.getElementById("gameScreen").style.display="none";
        document.getElementById("scoreText").textContent=`Well Done! You circled all numbers correctly`;
        document.getElementById("scoreScreen").style.display="flex";
      }
    }
  }else{
    element.classList.add("wrong");
    wrongSound.play();
    setTimeout(()=>element.classList.remove("wrong"),600);
  }
}

document.getElementById("playAgain").onclick = ()=>{
  currentSlide=0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadSlide(currentSlide);
};
</script>
</body>
</html>
