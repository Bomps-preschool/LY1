<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle the Number Game</title>
<style>
  body {
    margin:0;
    font-family: 'Arial', sans-serif;
    background:#ffeccf;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }

  #logoScreen, #gameScreen, #scoreScreen {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:absolute;
    top:0; left:0;
  }

  #logoScreen img {
    width:200px;
  }

  #instruction {
    background: #fffca0;
    padding:10px 20px;
    border-radius:8px;
    font-size:20px;
    margin-bottom:20px;
    text-align:center;
  }

  #objects {
    display:flex;
    gap:20px;
    margin:20px 0;
    flex-wrap: wrap;
    justify-content:center;
  }

  #objects img {
    width:100px;
    height:100px;
    border-radius:10px;
    background:white;
    padding:5px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  }

  #numbers {
    display:flex;
    gap:20px;
    flex-wrap: wrap;
    justify-content:center;
    margin-top:30px;
    max-width:90%;
  }

  .number {
    padding:10px 15px;
    font-size:24px;
    border-radius:10px;
    border:2px solid #000;
    cursor:pointer;
    background:white;
    user-select:none;
  }

  .number.correct { background:#a0ffaf; }
  .number.wrong { background:#ff9a9a; }

  #scoreScreen {
    background:#fff7e0;
    flex-direction:column;
    font-size:24px;
    display:none;
    align-items:center;
    justify-content:center;
  }

  #scoreScreen button {
    padding:10px 20px;
    font-size:20px;
    background:#ffdd57;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
  }

</style>
</head>
<body>

<!-- Innovine Logo Slide -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Count and circle the correct number</div>
  <div id="objects"></div>
  <div id="numbers"></div>
</div>

<!-- Score Screen -->
<div id="scoreScreen">
  <div id="scoreText"></div>
  <button id="playAgain">Play Again</button>
</div>

<script>
const slides = [
  { object:"popsicle.png", count:4, numberToCircle:4 },
  { object:"drum.png", count:1, numberToCircle:1 },
  { object:"cupcake.png", count:3, numberToCircle:3 },
  { object:"ball.png", count:5, numberToCircle:5 },
  { object:"lollipop.png", count:2, numberToCircle:2 }
];

let currentSlide = 0;
let correctClicks = 0;

// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

// Show logo for 5s
window.onload = () => {
  setTimeout(()=> {
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadSlide(currentSlide);
  },5000);
};

function loadSlide(index){
  const slide = slides[index];
  correctClicks = 0;
  const objectsDiv = document.getElementById("objects");
  const numbersDiv = document.getElementById("numbers");
  objectsDiv.innerHTML="";
  numbersDiv.innerHTML="";

  for(let i=0;i<slide.count;i++){
    const obj = document.createElement("img");
    obj.src=`assets/${slide.object}`;
    obj.dataset.number = slide.count;
    objectsDiv.appendChild(obj);
  }

  // Generate numbers from 1 to slide.count+2 for variety
  let nums = [];
  for(let i=1;i<=slide.count+2;i++) nums.push(i);
  nums.sort(()=>Math.random()-0.5);
  nums.forEach(n=>{
    const span = document.createElement("div");
    span.classList.add("number");
    span.textContent = n;
    span.addEventListener("click",()=> checkNumber(n, slide.count, span));
    numbersDiv.appendChild(span);
  });
}

function checkNumber(number, correctNumber, element){
  if(number==correctNumber){
    element.classList.add("correct");
    correctSound.play();
    correctClicks++;
    // check if all objects are circled
    if(correctClicks==slides[currentSlide].count){
      if(currentSlide<slides.length-1){
        currentSlide++;
        setTimeout(()=>loadSlide(currentSlide),600);
      }else{
        // show score screen
        document.getElementById("gameScreen").style.display="none";
        document.getElementById("scoreText").textContent=`Well Done! You circled all numbers correctly`;
        document.getElementById("scoreScreen").style.display="flex";
      }
    }
  }else{
    element.classList.add("wrong");
    wrongSound.play();
    setTimeout(()=>element.classList.remove("wrong"),600);
  }
}

document.getElementById("playAgain").onclick = ()=> {
  currentSlide=0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadSlide(currentSlide);
};
</script>
</body>
</html>
