<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle the Number Game</title>
<style>
  body { margin:0; font-family:'Arial', sans-serif; background:#ffeccf; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  #logoScreen, #gameScreen, #scoreScreen { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:absolute; top:0; left:0; }
  #logoScreen img { width:200px; }
  #instruction { background: #fffca0; padding:10px 20px; border-radius:8px; font-size:20px; margin:10px; text-align:center; position:relative; top:10px; }
  #objects { display:flex; gap:20px; margin:20px 0; flex-wrap: wrap; justify-content:center; }
  #objects img { width:80px; height:80px; border-radius:10px; background:white; padding:5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
  #canvasContainer { border:2px solid #000; background:white; position:relative; margin-top:20px; }
  #scoreScreen { background:#fff7e0; flex-direction:column; font-size:24px; display:none; justify-content:center; align-items:center; }
  #scoreScreen button { padding:10px 20px; font-size:20px; background:#ffdd57; border:none; border-radius:8px; cursor:pointer; margin-top:20px;}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Count and circle the correct number</div>
  <div id="objects"></div>
  <div id="canvasContainer">
    <canvas id="gameCanvas" width="500" height="300"></canvas>
  </div>
</div>

<!-- Score Screen -->
<div id="scoreScreen">
  <div id="scoreText"></div>
  <button id="playAgain">Play Again</button>
</div>

<script>
const slides = [
  { object:"popsicle.png", count:4, numberToCircle:4, numbers:[3,6,2,4,5,1] },
  { object:"drum.png", count:1, numberToCircle:1, numbers:[1,5,2,4,3] },
  { object:"cupcake.png", count:3, numberToCircle:3, numbers:[2,3,1,4] },
  { object:"ball.png", count:5, numberToCircle:5, numbers:[1,5,2,4,3,6] },
  { object:"lollipop.png", count:2, numberToCircle:2, numbers:[2,1,3,4] }
];

let currentSlide = 0;
let correctCount = 0;

// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let drawing = false;

// Keep track of correct numbers circled
let circledCorrect = [];

// Show logo for 5 seconds
window.onload = () => {
  setTimeout(()=> {
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadSlide(currentSlide);
  },5000);
};

function loadSlide(index){
  const slide = slides[index];
  correctCount = 0;
  circledCorrect = [];
  
  const objectsDiv = document.getElementById("objects");
  objectsDiv.innerHTML="";
  for(let i=0;i<slide.count;i++){
    const obj = document.createElement("img");
    obj.src=`assets/${slide.object}`;
    objectsDiv.appendChild(obj);
  }
  
  // Draw numbers randomly
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = "24px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  
  slide.positions = []; // store number positions for circle detection
  slide.numbers.forEach((num)=>{
    const x = Math.random()*(canvas.width-50)+25;
    const y = Math.random()*(canvas.height-50)+25;
    ctx.fillStyle="#000";
    ctx.fillText(num, x, y);
    slide.positions.push({num,x,y,radius:20}); // radius for detection
  });
}

// Canvas drawing for finger/cursor
canvas.addEventListener('mousedown',()=>drawing=true);
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('mouseout',()=>drawing=false);
canvas.addEventListener('mousemove',(e)=>{
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX-rect.left;
  const y = e.clientY-rect.top;
  ctx.beginPath();
  ctx.arc(x,y,20,0,2*Math.PI);
  ctx.strokeStyle="rgba(0,0,255,0.8)";
  ctx.lineWidth=2;
  ctx.stroke();
  
  checkCircle(x,y);
});

// Check if circle intersects a number
function checkCircle(x,y){
  const slide = slides[currentSlide];
  slide.positions.forEach(pos=>{
    if(Math.sqrt((x-pos.x)**2 + (y-pos.y)**2)<pos.radius){
      // already circled
      if(circledCorrect.includes(pos.num)) return;
      if(pos.num==slide.numberToCircle){
        circledCorrect.push(pos.num);
        ctx.fillStyle="#a0ffaf";
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,25,0,2*Math.PI);
        ctx.fill();
        correctSound.play();
      }else{
        ctx.fillStyle="#ff9a9a";
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,25,0,2*Math.PI);
        ctx.fill();
        wrongSound.play();
      }
      // check if all correct numbers circled
      if(circledCorrect.length==slide.count){
        if(currentSlide<slides.length-1){
          currentSlide++;
          setTimeout(()=>loadSlide(currentSlide),800);
        }else{
          // Show score
          document.getElementById("gameScreen").style.display="none";
          document.getElementById("scoreText").textContent=`Well Done! You circled all numbers correctly.`;
          document.getElementById("scoreScreen").style.display="flex";
        }
      }
    }
  });
}

document.getElementById("playAgain").onclick = ()=>{
  currentSlide=0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadSlide(currentSlide);
};
</script>
</body>
</html>
