<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle the Number - 2 Year Old</title>
<style>
  body {
    margin:0; font-family: 'Arial', sans-serif;
    background:#ffeccf; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;
  }
  #logoScreen, #gameScreen, #scoreScreen {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:absolute; top:0; left:0;
  }
  #logoScreen img { width:200px; }
  #instruction {
    background: #fffca0;
    padding:10px 20px; border-radius:8px;
    font-size:20px; margin-bottom:20px;
    text-align:center;
  }
  #objects {
    display:flex; gap:20px; margin:20px 0; flex-wrap: wrap; justify-content:center;
  }
  #objects img {
    width:100px; height:100px; border-radius:10px;
    background:white; padding:5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  }
  #numbersBox {
    width: 90%; background:#fff9d6; border-radius:8px;
    padding:20px; display:flex; flex-wrap: wrap; gap:20px; justify-content:center;
    user-select:none;
  }
  .number {
    width:60px; height:60px; display:flex; align-items:center; justify-content:center;
    font-size:28px; border:2px solid #000; border-radius:10px;
    cursor:pointer; background:white; touch-action: none;
  }
  .number.correct { background:#a0ffaf; }
  .number.wrong { background:#ff9a9a; }
  #scoreScreen { background:#fff7e0; flex-direction:column; font-size:24px; display:none; }
  #scoreScreen button { padding:10px 20px; font-size:20px; background:#ffdd57; border:none; border-radius:8px; cursor:pointer; margin-top:20px;}
</style>
</head>
<body>

<!-- Innovine Logo Slide -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Count and circle the correct number</div>
  <div id="objects"></div>
  <div id="numbersBox"></div>
</div>

<!-- Score Screen -->
<div id="scoreScreen">
  <div id="scoreText"></div>
  <button id="playAgain">Play Again</button>
</div>

<script>
// Slides config
const slides = [
  { object:"popsicle.png", count:4, numbers:[3,5,4,8,4,1,4,9] },
  { object:"drum.png", count:1, numbers:[1,2,3,5] },
  { object:"cupcake.png", count:3, numbers:[2,3,3,1] },
  { object:"ball.png", count:5, numbers:[5,2,5,1,3] },
  { object:"lollipop.png", count:2, numbers:[2,1,2,3] }
];

let currentSlide = 0;
let correctClicks = 0;

// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

// Show logo for 5s
window.onload = () => {
  setTimeout(()=> {
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadSlide(currentSlide);
  },5000);
};

function loadSlide(index){
  const slide = slides[index];
  correctClicks = 0;
  const objectsDiv = document.getElementById("objects");
  const numbersBox = document.getElementById("numbersBox");
  objectsDiv.innerHTML="";
  numbersBox.innerHTML="";

  for(let i=0;i<slide.count;i++){
    const obj = document.createElement("img");
    obj.src=`assets/${slide.object}`;
    objectsDiv.appendChild(obj);
  }

  slide.numbers.forEach(n=>{
    const span = document.createElement("div");
    span.classList.add("number");
    span.textContent = n;
    span.addEventListener("pointerdown",()=> checkNumber(n, slide.count, span));
    numbersBox.appendChild(span);
  });
}

function checkNumber(number, correctNumber, element){
  if(number==correctNumber){
    element.classList.add("correct");
    correctSound.play();
    correctClicks++;
    if(correctClicks==slides[currentSlide].count){
      setTimeout(()=>{
        if(currentSlide<slides.length-1){
          currentSlide++;
          loadSlide(currentSlide);
        }else{
          // show score
          document.getElementById("gameScreen").style.display="none";
          document.getElementById("scoreText").textContent=`Well Done! You circled all numbers correctly`;
          document.getElementById("scoreScreen").style.display="flex";
        }
      },600);
    }
  }else{
    element.classList.add("wrong");
    wrongSound.play();
    setTimeout(()=>element.classList.remove("wrong"),600);
  }
}

document.getElementById("playAgain").onclick = ()=> {
  currentSlide=0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadSlide(currentSlide);
};
</script>
</body>
</html>
