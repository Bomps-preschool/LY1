<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Game</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dfe7ef;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Screens */
#logo, #end {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* Game container */
#game {
  display: none;
  width: 100%;
  max-width: 500px;
  padding: 10px;
  text-align: center;
}

/* Letter */
.letter {
  font-size: 60px;
  color: #2f4f6f;
  margin-bottom: 10px;
}

/* Options */
.options {
  display: flex;
  gap: 10px;
}

.option {
  width: 50%;
  background: #fff4dc;
  border-radius: 12px;
  padding: 10px;
}

/* IMAGE FIX */
.option img {
  width: 100%;
  height: 140px;
  object-fit: contain;
  display: block;
}

/* Text */
.option p {
  font-size: 16px;
  margin-top: 6px;
}

/* Button */
button {
  padding: 10px 18px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #6bbf59;
  color: white;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logo">
  <img src="assets/innovine-logo.png" width="160">
</div>

<!-- GAME -->
<div id="game">
  <div class="letter" id="letter"></div>

  <div class="options">
    <div class="option" onclick="check(0)">
      <img id="img1">
      <p id="txt1"></p>
    </div>
    <div class="option" onclick="check(1)">
      <img id="img2">
      <p id="txt2"></p>
    </div>
  </div>
</div>

<!-- END -->
<div id="end" style="display:none;">
  <h2>Well Done 🎉</h2>
  <button onclick="restart()">Play Again</button>
</div>

<audio id="right" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>
const base = [
{l:'A', c:{i:'apple.png',t:'Apple'}, w:{i:'egg.png',t:'Egg'}},
{l:'B', c:{i:'books.png',t:'Books'}, w:{i:'elephant.png',t:'Elephant'}},
{l:'C', c:{i:'carrot.png',t:'Carrot'}, w:{i:'frog.png',t:'Frog'}},
{l:'D', c:{i:'drum.png',t:'Drum'}, w:{i:'sun.png',t:'Sun'}},
{l:'B', c:{i:'banana.png',t:'Banana'}, w:{i:'van.png',t:'Van'}},
{l:'A', c:{i:'ant.png',t:'Ant'}, w:{i:'queen.png',t:'Queen'}},
{l:'D', c:{i:'dog.png',t:'Dog'}, w:{i:'tree.png',t:'Tree'}},
{l:'C', c:{i:'cake.png',t:'Cake'}, w:{i:'xylophone.png',t:'Xylophone'}}
];

let q=[], i=0, lock=false;

/* Shuffle */
function shuffle(a){
  for(let j=a.length-1;j>0;j--){
    let k=Math.floor(Math.random()*(j+1));
    [a[j],a[k]]=[a[k],a[j]];
  }
  return a;
}

/* Prepare */
function prepare(){
  q = base.map(x=>{
    let o=[{...x.c,correct:true},{...x.w,correct:false}];
    return {l:x.l,o:shuffle(o)};
  });
}

/* Load (FAST + IMAGE FIRST) */
function load(){
  lock=false;
  let x=q[i];

  // preload next images silently
  new Image().src = 'assets/'+x.o[0].i;
  new Image().src = 'assets/'+x.o[1].i;

  img1.src='assets/'+x.o[0].i;
  img2.src='assets/'+x.o[1].i;

  letter.innerText=x.l;
  txt1.innerText=x.o[0].t;
  txt2.innerText=x.o[1].t;
}

/* Answer */
function check(idx){
  if(lock) return;
  lock=true;

  if(q[i].o[idx].correct) right.play();
  else wrong.play();

  setTimeout(()=>{
    i++;
    if(i>=q.length) endGame();
    else load();
  },250);
}

/* End */
function endGame(){
  game.style.display='none';
  end.style.display='flex';
}

/* Restart */
function restart(){
  i=0;
  prepare();
  end.style.display='none';
  game.style.display='block';
  load();
}

/* START (NO BLOCKING) */
setTimeout(()=>{
  logo.style.display='none';
  game.style.display='block';
  prepare();
  load();
},3000);
</script>

</body>
</html>
