<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Game A-D</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e8f0f7; /* soft blue background */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

#logo-screen, #end-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: #e8f0f7;
}

#logo-screen img {
  width: 180px;
}

#game-container {
  display: none;
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.letter {
  font-size: 64px;
  margin-bottom: 10px;
  color: #355c7d;
}

.options {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.option {
  width: 48%;
  background: #fff6e5;
  border-radius: 15px;
  padding: 10px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}

.option:active {
  transform: scale(0.96);
}

.option img {
  width: 100%;
  height: 150px;
  object-fit: contain;
}

.option p {
  font-size: 18px;
  margin: 5px 0 0;
}

button {
  margin-top: 20px;
  padding: 12px 24px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #6bbf59;
  color: white;
}

#confetti {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="logo-screen">
  <img src="assets/innovine-logo.png" alt="Logo">
</div>

<div id="game-container">
  <div class="letter" id="letter"></div>
  <div class="options">
    <div class="option" onclick="checkAnswer(0)">
      <img id="img1">
      <p id="text1"></p>
    </div>
    <div class="option" onclick="checkAnswer(1)">
      <img id="img2">
      <p id="text2"></p>
    </div>
  </div>
  <canvas id="confetti"></canvas>
</div>

<div id="end-screen" style="display:none;">
  <h1>Well Done 🎉</h1>
  <button onclick="restartGame()">Play Again</button>
  <canvas id="confettiEnd"></canvas>
</div>

<audio id="rightSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const baseQuestions = [
  { letter: 'A', correct:{img:'assets/apple.png',text:'Apple'}, wrong:{img:'assets/egg.png',text:'Egg'} },
  { letter: 'B', correct:{img:'assets/books.png',text:'Books'}, wrong:{img:'assets/elephant.png',text:'Elephant'} },
  { letter: 'C', correct:{img:'assets/carrot.png',text:'Carrot'}, wrong:{img:'assets/frog.png',text:'Frog'} },
  { letter: 'D', correct:{img:'assets/drum.png',text:'Drum'}, wrong:{img:'assets/sun.png',text:'Sun'} },
  { letter: 'B', correct:{img:'assets/banana.png',text:'Banana'}, wrong:{img:'assets/van.png',text:'Van'} },
  { letter: 'A', correct:{img:'assets/ant.png',text:'Ant'}, wrong:{img:'assets/queen.png',text:'Queen'} },
  { letter: 'D', correct:{img:'assets/dog.png',text:'Dog'}, wrong:{img:'assets/tree.png',text:'Tree'} },
  { letter: 'C', correct:{img:'assets/cake.png',text:'Cake'}, wrong:{img:'assets/xylophone.png',text:'Xylophone'} }
];

let questions = [];
let current = 0;
let locked = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function prepareQuestions() {
  questions = baseQuestions.map(q => {
    const opts = [
      {...q.correct, correct:true},
      {...q.wrong, correct:false}
    ];
    return { letter:q.letter, options:shuffle(opts) };
  });
}

// Strong preloading (keeps images in memory)
let imageCache = {};
function preloadImages() {
  const imgs = [
    'assets/apple.png','assets/egg.png','assets/books.png','assets/elephant.png',
    'assets/carrot.png','assets/frog.png','assets/drum.png','assets/sun.png',
    'assets/banana.png','assets/van.png','assets/ant.png','assets/queen.png',
    'assets/dog.png','assets/tree.png','assets/cake.png','assets/xylophone.png'
  ];
  imgs.forEach(src => {
    const img = new Image();
    img.src = src;
    imageCache[src] = img;
  });
});
}

function loadQuestion() {
  locked = false;
  const q = questions[current];

  // Use preloaded images (instant display)
  document.getElementById('img1').src = imageCache[q.options[0].img]?.src || q.options[0].img;
  document.getElementById('img2').src = imageCache[q.options[1].img]?.src || q.options[1].img;

  document.getElementById('letter').innerText = q.letter;
  document.getElementById('text1').innerText = q.options[0].text;
  document.getElementById('text2').innerText = q.options[1].text;
}

function checkAnswer(index) {
  if (locked) return;
  locked = true;

  const correct = questions[current].options[index].correct;

  if (correct) {
    document.getElementById('rightSound').play();
  } else {
    document.getElementById('wrongSound').play();
  }

  setTimeout(() => {
    current++;
    if (current >= questions.length) {
      endGame();
    } else {
      loadQuestion();
    }
  }, 300);
}

function endGame() {
  document.getElementById('game-container').style.display = 'none';
  document.getElementById('end-screen').style.display = 'flex';
  startConfetti('confettiEnd');
}

function restartGame() {
  current = 0;
  prepareQuestions();
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  loadQuestion();
}

function startConfetti(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let pieces = Array.from({length:60}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*5+2
  }));

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#6bbf59';
    pieces.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    });
    pieces.forEach(p => {
      p.y += 2;
      if (p.y > canvas.height) p.y = 0;
    });
  }

  setInterval(draw, 30);
}

setTimeout(() => {
  document.getElementById('logo-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  preloadImages();
  prepareQuestions();
  loadQuestion();
}, 5000);
</script>

</body>
</html>
