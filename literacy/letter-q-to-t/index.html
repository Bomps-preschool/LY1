<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Balloon Pop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background: linear-gradient(135deg, #ffe6f0, #d6f7ff, #fff3cd);
}

#logoScreen,#gameScreen,#scoreScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#logoScreen img{ width:220px; }

#instruction{
  position:absolute;
  top:20px;
  background:white;
  padding:14px 22px;
  border-radius:14px;
  font-size:34px;
  font-weight:bold;
  color:#ff4d6d;
}

.balloon-container{
  width:80%;
  height:70%;
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  place-items:center;
  position:absolute;
  top:18%;
}

.balloon{
  width:150px;
  cursor:pointer;
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%{ transform: translateY(0px); }
  50%{ transform: translateY(-12px); }
  100%{ transform: translateY(0px); }
}

/* FRIEND POPUP */
#friendPopup{
  position:absolute;
  width:250px;
  display:none;
  z-index:999;
}

.pop{
  transform: scale(0);
  opacity:0;
}

#scoreScreen{
  display:none;
  background:#fff7e6;
  font-size:34px;
}

button{
  margin-top:20px;
  padding:12px 24px;
  font-size:22px;
  border:none;
  background:#ffd166;
  border-radius:12px;
}
</style>
</head>

<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png">
</div>

<div id="gameScreen" style="display:none;"></div>

<img id="friendPopup" src="">

<div id="scoreScreen">
  <div>🎉 Well Done!</div>
  <button onclick="restart()">Play Again</button>
</div>

<script>

const letters = ["Q","R","S","T"];
let currentIndex = 0;

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

/* NEW: letter audio mapping */
const audioMap = {
  Q: "assets/letter-q.mp3",
  R: "assets/letter-r.mp3",
  S: "assets/letter-s.mp3",
  T: "assets/letter-t.mp3"
};

/* NEW: friend mapping */
const friendMap = {
  Q: "assets/queen.png",
  R: "assets/rabbit.png",
  S: "assets/sun.png",
  T: "assets/train.png"
};

window.onload = () => {
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadRound();
  },5000);
};

function loadRound(){

  const game = document.getElementById("gameScreen");
  game.innerHTML = "";

  const target = letters[currentIndex];

  const title = document.createElement("div");
  title.id = "instruction";
  title.innerText = `Pop the letter ${target} balloon!`;
  game.appendChild(title);

  /* FIX 1: proper audio for each letter */
  const instrAudio = new Audio(audioMap[target]);
  instrAudio.play();

  const container = document.createElement("div");
  container.className = "balloon-container";
  game.appendChild(container);

  letters.forEach((ltr)=>{

    const b = document.createElement("img");
    b.className="balloon";
    b.src = `assets/balloon-${ltr.toLowerCase()}.png`;

    b.onclick = () => {

      if(ltr === target){

        correctSound.play();

        b.style.transform="scale(0)";
        b.style.opacity="0";

        /* FIX 2: show FRIEND */
        setTimeout(()=>{
          const popup = document.getElementById("friendPopup");
          popup.src = friendMap[target];
          popup.style.display="block";
          popup.style.left="40%";
          popup.style.top="40%";

          setTimeout(()=>{
            popup.style.display="none";

            currentIndex++;

            if(currentIndex < letters.length){
              loadRound();
            } else {
              showScore();
            }

          },1500);

        },600);

      } else {
        wrongSound.play();
      }
    };

    container.appendChild(b);
  });
}

function showScore(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("scoreScreen").style.display="flex";
}

function restart(){
  currentIndex = 0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadRound();
}

</script>

</body>
</html>
