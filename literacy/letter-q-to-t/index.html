<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Balloon Pop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;

  background: url("assets/background.png") no-repeat center center fixed;
  background-size: cover;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

/* SCREENS */
#logoScreen,#gameScreen,#scoreScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* LOGO */
#logoScreen img{ width:220px; }

/* INSTRUCTION */
#instruction{
  position:absolute;
  top:20px;
  background:white;
  padding:14px 22px;
  border-radius:14px;
  font-size:34px;
  font-weight:bold;
  color:#ff4d6d;
}

/* GRID */
.balloon-container{
  width:80%;
  height:70%;
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  place-items:center;
  position:absolute;
  top:18%;
}

/* 🎈 BALLOONS (KEEP CARD) */
.balloon{
  width:150px;
  cursor:pointer;
  animation: float 3s ease-in-out infinite;

  background:white;
  padding:12px;
  border-radius:18px;
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
  border:3px solid rgba(255,255,255,0.7);
}

@keyframes float{
  0%{ transform: translateY(0px); }
  50%{ transform: translateY(-12px); }
  100%{ transform: translateY(0px); }
}

/* POP */
.pop{
  transform: scale(0);
  opacity:0;
}

/* 👑 FRIEND IMAGE (CLEAN FIX) */
#friendPopup{
  position:absolute;
  width:260px;
  display:none;
  z-index:999;

  /* IMPORTANT: do NOT force any card look */
  background: transparent;
  border: none;
  box-shadow: none;
}

/* SCORE */
#scoreScreen{
  display:none;
  background:#fff7e6;
  font-size:34px;
}

button{
  margin-top:20px;
  padding:12px 24px;
  font-size:22px;
  border:none;
  background:#ffd166;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;"></div>

<!-- FRIEND -->
<img id="friendPopup">

<!-- SCORE -->
<div id="scoreScreen">
  <div>🎉 Well Done!</div>
  <button onclick="restart()">Play Again</button>
</div>

<script>

const letters = ["Q","R","S","T"];
let currentIndex = 0;

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

/* FRIEND IMAGES */
const friendMap = {
  Q: "assets/queen.png",
  R: "assets/rainbow.png",
  S: "assets/strawberry.png",
  T: "assets/tent.png"
};

/* FRIEND AUDIO */
const friendAudioMap = {
  Q: "assets/queen.mp3",
  R: "assets/rainbow.mp3",
  S: "assets/strawberry.mp3",
  T: "assets/tent.mp3"
};

/* SPEECH */
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.9;
  msg.pitch = 1;
  window.speechSynthesis.speak(msg);
}

/* SHUFFLE */
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

const slots = [
  {x:0,y:0},
  {x:1,y:0},
  {x:0,y:1},
  {x:1,y:1}
];

window.onload = () => {
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadRound();
  },5000);
};

function loadRound(){

  const game = document.getElementById("gameScreen");
  game.innerHTML = "";

  const target = letters[currentIndex];

  const title = document.createElement("div");
  title.id = "instruction";
  title.innerText = `Pop the letter ${target} balloon!`;
  game.appendChild(title);

  speak(`Pop the letter ${target} balloon`);

  const container = document.createElement("div");
  container.className = "balloon-container";
  game.appendChild(container);

  const shuffled = shuffle([...letters]);

  shuffled.forEach((ltr,i)=>{

    const b = document.createElement("img");
    b.className="balloon";
    b.src = `assets/balloon-${ltr.toLowerCase()}.png`;

    const pos = slots[i];
    b.style.gridColumn = pos.x + 1;
    b.style.gridRow = pos.y + 1;

    b.onclick = () => {

      if(ltr === target){

        correctSound.play();
        b.classList.add("pop");

        correctSound.onended = () => {

          container.innerHTML = "";

          const friend = document.getElementById("friendPopup");
          friend.src = friendMap[target];
          friend.style.display="block";
          friend.style.left="40%";
          friend.style.top="35%";

          const audio = new Audio(friendAudioMap[target]);
          audio.play();

          setTimeout(()=>{

            friend.style.display="none";
            currentIndex++;

            if(currentIndex < letters.length){
              loadRound();
            } else {
              showScore();
            }

          },5000);
        };

      } else {
        wrongSound.play();
      }
    };

    container.appendChild(b);
  });
}

function showScore(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("scoreScreen").style.display="flex";
}

function restart(){
  currentIndex = 0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadRound();
}

</script>

</body>
</html>
