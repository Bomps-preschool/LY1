<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Balloon Pop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background: linear-gradient(135deg, #ffe6f0, #d6f7ff, #fff3cd);
}

#logoScreen,#gameScreen,#scoreScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#logoScreen img{ width:220px; }

#instruction{
  position:absolute;
  top:20px;
  background:white;
  padding:14px 22px;
  border-radius:14px;
  font-size:34px;
  font-weight:bold;
  color:#ff4d6d;
}

.balloon-container{
  width:100%;
  height:100%;
  position:absolute;
}

.balloon{
  width:150px;
  position:absolute;
  cursor:pointer;
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%{ transform: translateY(0px); }
  50%{ transform: translateY(-12px); }
  100%{ transform: translateY(0px); }
}

.pop{
  transform: scale(0);
  opacity:0;
}

#friendPopup{
  position:absolute;
  width:220px;
  display:none;
  z-index:999;
}

#scoreScreen{
  display:none;
  background:#fff7e6;
  font-size:34px;
}

button{
  margin-top:20px;
  padding:12px 24px;
  font-size:22px;
  border:none;
  background:#ffd166;
  border-radius:12px;
}
</style>
</head>

<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png">
</div>

<div id="gameScreen" style="display:none;"></div>

<img id="friendPopup">

<div id="scoreScreen">
  <div>🎉 Well Done!</div>
  <button onclick="restart()">Play Again</button>
</div>

<script>

const letters = ["Q","R","S","T"];
let currentIndex = 0;

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

/* FRIENDS */
const friendMap = {
  Q: "assets/queen.png",
  R: "assets/rainbow.png",
  S: "assets/strawberry.png",
  T: "assets/tent.png"
};

/* RESTORED ORIGINAL STYLE AUDIO */
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.9;
  msg.pitch = 1;
  window.speechSynthesis.speak(msg);
}

window.onload = () => {
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadRound();
  },5000);
};

function loadRound(){

  const game = document.getElementById("gameScreen");
  game.innerHTML = "";

  const target = letters[currentIndex];

  /* instruction */
  const title = document.createElement("div");
  title.id = "instruction";
  title.innerText = `Pop the letter ${target} balloon!`;
  game.appendChild(title);

  /* RESTORED AUDIO EXACT BEHAVIOR */
  speak(`Pop the letter ${target} balloon`);

  const container = document.createElement("div");
  container.className = "balloon-container";
  game.appendChild(container);

  let positions = [];

  function randomPos(){
    return {
      x: Math.random() * (window.innerWidth - 160),
      y: Math.random() * (window.innerHeight - 220)
    };
  }

  letters.forEach((ltr)=>{

    const b = document.createElement("img");
    b.className="balloon";
    b.src = `assets/balloon-${ltr.toLowerCase()}.png`;

    let pos = randomPos();
    b.style.left = pos.x + "px";
    b.style.top = pos.y + "px";

    b.onclick = () => {

      if(ltr === target){

        correctSound.play();
        b.classList.add("pop");

        correctSound.onended = () => {

          /* SHOW FRIEND */
          const friend = document.getElementById("friendPopup");
          friend.src = friendMap[target];
          friend.style.display="block";
          friend.style.left="40%";
          friend.style.top="35%";

          /* FIX: SHOW FOR 5 SECONDS */
          setTimeout(()=>{

            friend.style.display="none";
            currentIndex++;

            if(currentIndex < letters.length){
              loadRound();   // NEW RANDOM POSITIONS EACH ROUND
            } else {
              showScore();
            }

          },5000);
        };

      } else {
        wrongSound.play();
      }
    };

    container.appendChild(b);
  });
}

function showScore(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("scoreScreen").style.display="flex";
}

function restart(){
  currentIndex = 0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadRound();
}

</script>

</body>
</html>
