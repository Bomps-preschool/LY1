<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Balloon Pop Game</title>
<style>
body {
  margin:0;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(to top, #a8edea, #fed6e3);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
}
#logoScreen, #gameScreen, #scoreScreen {
  width:100%;
  height:100%;
  position:absolute;
  top:0;
  left:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
#logoScreen img {
  width:200px;
}
#instruction {
  background:white;
  padding:10px 20px;
  border-radius:10px;
  font-size:28px;
  font-weight:bold;
  text-align:center;
  margin-bottom:20px;
  color:#ff4f81;
}
.balloon {
  position:absolute;
  width:120px;
  cursor:pointer;
  transition: transform 0.3s, opacity 0.3s;
}
#scoreScreen {
  background:#fff7e0;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  display:none;
  font-size:28px;
}
#scoreScreen button {
  margin-top:20px;
  padding:10px 20px;
  font-size:22px;
  border:none;
  border-radius:8px;
  background:#ffdd57;
  cursor:pointer;
}
#confetti-canvas {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Tap the correct balloon!</div>
</div>

<!-- Score Screen -->
<div id="scoreScreen">
  <div id="scoreText">Well Done!</div>
  <canvas id="confetti-canvas"></canvas>
  <button id="playAgain">Play Again</button>
</div>

<script>
// Slides definition
const slides = [
  {letter:'Q', balloon:'balloon-q.png', audio:'assets/letter-q.mp3'},
  {letter:'R', balloon:'balloon-r.png', audio:'assets/letter-r.mp3'},
  {letter:'S', balloon:'balloon-s.png', audio:'assets/letter-s.mp3'},
  {letter:'T', balloon:'balloon-t.png', audio:'assets/letter-t.mp3'}
];

let currentSlide = 0;

// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

// Show logo for 5s
window.onload = () => {
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadSlide(currentSlide);
  },5000);
};

function loadSlide(index){
  const slide = slides[index];
  const gameScreen = document.getElementById('gameScreen');
  gameScreen.innerHTML = `<div id="instruction">Tap the ${slide.letter} balloon!</div>`;

  // Play instruction audio
  const instrAudio = new Audio(slide.audio);
  instrAudio.play();

  // Create multiple balloons
  for(let i=0;i<5;i++){
    const b = document.createElement('img');
    b.src = `assets/${slide.balloon}`;
    b.classList.add('balloon');
    // Random position
    b.style.left = `${Math.random()*70 + 10}%`;
    b.style.top = `${Math.random()*70 + 10}%`;
    b.style.transform = `scale(${0.8 + Math.random()*0.4})`;
    b.addEventListener('click', ()=>{
      if(i===0){ // correct balloon
        correctSound.play();
        // Pop animation
        b.style.transform="scale(0)";
        b.style.opacity=0;
        // wait until correct sound finishes
        correctSound.onended = ()=>{
          currentSlide++;
          if(currentSlide<slides.length){
            loadSlide(currentSlide);
          }else{
            document.getElementById("gameScreen").style.display="none";
            document.getElementById("scoreScreen").style.display="flex";
            launchConfetti();
          }
        };
      }else{
        wrongSound.play();
      }
    });
    gameScreen.appendChild(b);
  }
}

// Play again
document.getElementById("playAgain").onclick = ()=>{
  currentSlide = 0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadSlide(currentSlide);
};

// Confetti
function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const confettis = [];
  for(let i=0;i<200;i++){
    confettis.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*6+4,
      d: Math.random()*20+10,
      color:`hsl(${Math.random()*360},100%,50%)`
    });
  }
  let angle=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettis.forEach(c=>{
      ctx.fillStyle=c.color;
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,2*Math.PI);
      ctx.fill();
      c.y += 1+Math.sin(angle)*2;
      if(c.y>canvas.height){c.y=-10; c.x=Math.random()*canvas.width;}
    });
    angle+=0.01;
    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
</html>
