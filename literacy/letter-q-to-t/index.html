<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Balloon Pop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background: linear-gradient(to bottom, #ffe6f0, #d6f7ff);
}

/* Screens */
#logoScreen,#gameScreen,#scoreScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* Logo */
#logoScreen img{
  width:220px;
}

/* Instruction */
#instruction{
  position:absolute;
  top:20px;
  background:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:30px;
  font-weight:bold;
  color:#ff4d6d;
}

/* Balloon */
.balloon{
  width:110px;
  position:absolute;
  cursor:pointer;
  transition:transform 0.2s ease;
}

/* Score */
#scoreScreen{
  display:none;
  background:#fff7e6;
  font-size:32px;
}

button{
  margin-top:20px;
  padding:10px 20px;
  font-size:20px;
  border:none;
  background:#ffd166;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
  <div id="instruction">Tap the correct balloon!</div>
</div>

<!-- SCORE -->
<div id="scoreScreen">
  <div>🎉 Well Done!</div>
  <button onclick="restart()">Play Again</button>
</div>

<script>

const letters = ["Q","R","S","T"];
let currentIndex = 0;

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

/* SPLASH SCREEN */
window.onload = () => {
  setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameScreen").style.display="flex";
    loadRound();
  },5000);
};

function loadRound(){

  const game = document.getElementById("gameScreen");
  game.innerHTML = `<div id="instruction">Pop the letter ${letters[currentIndex]} balloon!</div>`;

  const target = letters[currentIndex];

  // create all 4 balloons
  letters.forEach((ltr)=>{
    
    const b = document.createElement("img");
    b.className="balloon";
    b.src = `assets/balloon-${ltr.toLowerCase()}.png`;

    // random position
    b.style.left = Math.random()*80 + "%";
    b.style.top = Math.random()*70 + 20 + "%";

    b.onclick = () => {

      if(ltr === target){
        correctSound.play();

        b.style.transform="scale(0)";
        b.style.opacity="0";

        correctSound.onended = () => {
          currentIndex++;

          if(currentIndex < letters.length){
            loadRound();
          } else {
            showScore();
          }
        };

      } else {
        wrongSound.play();
      }
    };

    game.appendChild(b);
  });
}

function showScore(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("scoreScreen").style.display="flex";
}

function restart(){
  currentIndex = 0;
  document.getElementById("scoreScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  loadRound();
}

</script>

</body>
</html>
