<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Letter Drag Game</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#d8e7ef;
  overflow:hidden;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOGO + END */
#logoScreen,
#endScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* GAME */
#game{
  display:none;
  width:100%;
  max-width:950px;
  padding:15px;
}

/* LAYOUT */
.game-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}

/* LETTER */
.letter-box{
  width:28%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.letter{
  width:140px;
  height:140px;
  border-radius:22px;
  border:4px dashed #355c7d;
  background:#fff3d6;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:78px;
  font-weight:bold;
  color:#355c7d;
  user-select:none;
  cursor:grab;
  touch-action:none;
  position:relative;
  z-index:10;
}

/* OPTIONS */
.options{
  width:72%;
  display:flex;
  gap:15px;
}

.option{
  width:50%;
  background:#fff3d6;
  border-radius:18px;
  padding:10px;
  min-height:260px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
}

.option img{
  width:100%;
  height:170px;
  object-fit:contain;
  pointer-events:none;
}

.option p{
  font-size:20px;
  margin-top:8px;
  color:#333;
  pointer-events:none;
}

/* FEEDBACK */
#feedback{
  height:100px;
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#feedback img{
  height:80px;
}

/* BUTTON */
button{
  padding:12px 24px;
  border:none;
  border-radius:10px;
  background:#6bbf59;
  color:white;
  font-size:18px;
}

/* MOBILE */
@media(max-width:700px){

  .game-area{
    gap:10px;
  }

  .letter{
    width:95px;
    height:95px;
    font-size:56px;
  }

  .option{
    min-height:210px;
    padding:8px;
  }

  .option img{
    height:115px;
  }

  .option p{
    font-size:16px;
  }

  #feedback img{
    height:65px;
  }
}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" width="180">
</div>

<!-- GAME -->
<div id="game">

  <div class="game-area">

    <!-- LETTER -->
    <div class="letter-box">

      <div class="letter"
           id="dragLetter">
      </div>

    </div>

    <!-- OPTIONS -->
    <div class="options">

      <div class="option" id="drop1">
        <img id="img1">
        <p id="txt1"></p>
      </div>

      <div class="option" id="drop2">
        <img id="img2">
        <p id="txt2"></p>
      </div>

    </div>

  </div>

  <!-- FEEDBACK -->
  <div id="feedback"></div>

</div>

<!-- END -->
<div id="endScreen" style="display:none;">

  <h1>Well Done 🎉</h1>

  <button onclick="restartGame()">
    Play Again
  </button>

  <canvas id="confetti"></canvas>

</div>

<!-- AUDIO -->
<audio id="rightSound" preload="auto">
  <source src="assets/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound" preload="auto">
  <source src="assets/wrong.mp3" type="audio/mpeg">
</audio>

<script>

const base = [

{l:'E', c:{i:'egg.png',t:'Egg'}, w:{i:'bat.png',t:'Bat'}},

{l:'G', c:{i:'girl.png',t:'Girl'}, w:{i:'sun.png',t:'Sun'}},

{l:'H', c:{i:'house.png',t:'House'}, w:{i:'kite.png',t:'Kite'}},

{l:'F', c:{i:'fish.png',t:'Fish'}, w:{i:'jacket.png',t:'Jacket'}},

{l:'E', c:{i:'elephant.png',t:'Elephant'}, w:{i:'inkpot.png',t:'Inkpot'}},

{l:'H', c:{i:'hat.png',t:'Hat'}, w:{i:'yarn.png',t:'Yarn'}},

{l:'F', c:{i:'fan.png',t:'Fan'}, w:{i:'bag.png',t:'Bag'}},

{l:'G', c:{i:'gift.png',t:'Gift'}, w:{i:'aligator.png',t:'Aligator'}}

];

let questions = [];
let current = 0;
let locked = false;

/* AUDIO */
const rightAudio =
document.getElementById("rightSound");

const wrongAudio =
document.getElementById("wrongSound");

/* PRELOAD */
base.forEach(q=>{

[q.c.i,q.w.i].forEach(img=>{

  let preload = new Image();
  preload.src = "assets/" + img;

});

});

/* SHUFFLE */
function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

  let j=Math.floor(Math.random()*(i+1));

  [arr[i],arr[j]]=[arr[j],arr[i]];

}

return arr;

}

/* PREPARE */
function prepareQuestions(){

questions = base.map(q=>{

  let options = shuffle([
    {...q.c,correct:true},
    {...q.w,correct:false}
  ]);

  return{
    letter:q.l,
    options
  };

});

}

/* LOAD */
function loadQuestion(){

locked=false;

feedback.innerHTML="";

let q = questions[current];

dragLetter.innerText = q.letter;

img1.src = "assets/" + q.options[0].i;
txt1.innerText = q.options[0].t;

img2.src = "assets/" + q.options[1].i;
txt2.innerText = q.options[1].t;

drop1.dataset.correct =
q.options[0].correct;

drop2.dataset.correct =
q.options[1].correct;

resetLetter();

}

/* RESET LETTER */
function resetLetter(){

dragLetter.style.transform =
"translate(0px,0px)";

}

/* CHECK ANSWER */
function checkAnswer(correct){

if(locked) return;

locked = true;

/* CORRECT */
if(correct){

  feedback.innerHTML =
  "<img src='assets/thumbs-up.png'>";

  rightAudio.pause();
  rightAudio.currentTime = 0;

  let p = rightAudio.play();

  if(p!==undefined){
    p.catch(()=>{});
  }

}

/* WRONG */
else{

  feedback.innerHTML =
  "<img src='assets/try-again.png'>";

  wrongAudio.pause();
  wrongAudio.currentTime = 0;

  let p = wrongAudio.play();

  if(p!==undefined){
    p.catch(()=>{});
  }

}

setTimeout(()=>{

  current++;

  if(current >= questions.length){

    endGame();

  }else{

    loadQuestion();

  }

},1200);

}

/* DRAG FOR MOBILE + TAB + DESKTOP */

const dragLetter =
document.getElementById("dragLetter");

let startX = 0;
let startY = 0;
let moveX = 0;
let moveY = 0;

/* TOUCH START */
dragLetter.addEventListener(
"touchstart",
startDrag,
{passive:false}
);

/* MOUSE START */
dragLetter.addEventListener(
"mousedown",
startDrag
);

function startDrag(e){

e.preventDefault();

let touch = e.touches ?
e.touches[0] : e;

startX = touch.clientX;
startY = touch.clientY;

document.addEventListener(
"touchmove",
moveDrag,
{passive:false}
);

document.addEventListener(
"mousemove",
moveDrag
);

document.addEventListener(
"touchend",
endDrag
);

document.addEventListener(
"mouseup",
endDrag
);

}

/* MOVE */
function moveDrag(e){

e.preventDefault();

let touch = e.touches ?
e.touches[0] : e;

moveX = touch.clientX - startX;
moveY = touch.clientY - startY;

dragLetter.style.transform =
`translate(${moveX}px,${moveY}px)`;

}

/* END */
function endDrag(){

document.removeEventListener(
"touchmove",
moveDrag
);

document.removeEventListener(
"mousemove",
moveDrag
);

document.removeEventListener(
"touchend",
endDrag
);

document.removeEventListener(
"mouseup",
endDrag
);

/* DROP DETECTION */
const letterRect =
dragLetter.getBoundingClientRect();

const d1 =
drop1.getBoundingClientRect();

const d2 =
drop2.getBoundingClientRect();

/* DROP 1 */
if(intersect(letterRect,d1)){

  checkAnswer(
  drop1.dataset.correct === "true"
  );

}

/* DROP 2 */
else if(intersect(letterRect,d2)){

  checkAnswer(
  drop2.dataset.correct === "true"
  );

}

else{

  resetLetter();

}

}

/* INTERSECTION */
function intersect(r1,r2){

return !(
r2.left > r1.right ||
r2.right < r1.left ||
r2.top > r1.bottom ||
r2.bottom < r1.top
);

}

/* END GAME */
function endGame(){

game.style.display="none";

endScreen.style.display="flex";

startConfetti();

}

/* PLAY AGAIN */
function restartGame(){

current = 0;

prepareQuestions();

endScreen.style.display="none";

game.style.display="block";

loadQuestion();

}

/* CONFETTI */
function startConfetti(){

const c =
document.getElementById("confetti");

const ctx = c.getContext("2d");

c.width = window.innerWidth;
c.height = window.innerHeight;

const pieces =
Array.from({length:80},()=>({

x:Math.random()*c.width,
y:Math.random()*c.height,
r:Math.random()*5+2

}));

setInterval(()=>{

ctx.clearRect(0,0,c.width,c.height);

ctx.fillStyle="#6bbf59";

pieces.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,6.28);

ctx.fill();

p.y += 2;

if(p.y > c.height){

p.y = 0;

}

});

},30);

}

/* START */
setTimeout(()=>{

logoScreen.style.display="none";

game.style.display="block";

prepareQuestions();

loadQuestion();

},5000);

</script>

</body>
</html>
